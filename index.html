    const unread = S.activity.filter((a) => a.ts > ui.bellSeen).length;
    const recent = S.activity.slice(0, 6);
    $('#topbar').innerHTML =
      '<button class="icon-btn menu-btn" data-act="drawer-open" aria-label="Open navigation">' + icon('menu', 20) + '</button>' +
      '<div class="district-chip" title="Current district">' + icon('pin', 16) + '<span>' + esc(d.name) + '</span></div>' +
      '<div class="spacer"></div>' +
      '<div class="cash meter-chip" aria-label="Energy ' + p.energy + ' of ' + MOB.CONFIG.maxEnergy + '" title="Energy">' + icon('bolt', 16) + '<span class="num">' + p.energy + '</span></div>' +
      '<div class="cash" aria-label="Cash">' + icon('dollar', 16) + '<span class="num">' + money(p.cashMinor) + '</span></div>' +
      '<div class="pop-wrap"><button class="icon-btn" data-act="pop-bell" aria-label="Notifications' + (unread ? ', ' + unread + ' new' : '') + '" aria-expanded="' + (ui.pop === 'bell') + '">' + icon('bell', 18) + (unread ? '<span class="badge-dot">' + (unread > 9 ? '9+' : unread) + '</span>' : '') + '</button>' +
      (ui.pop === 'bell' ? '<div class="popover" role="dialog" aria-label="Recent activity"><h4>Word on the street</h4>' + recent.map((a) => '<div class="pop-item"><div>' + esc(a.text) + '<time>' + (a.kind === 'demo' ? 'Demo event' : ago(a.ts)) + '</time></div></div>').join('') + '</div>' : '') + '</div>' +
      '<div class="pop-wrap"><button class="avatar-btn" data-act="pop-menu" aria-label="Player menu" aria-expanded="' + (ui.pop === 'menu') + '">' + portrait(p.portrait, 40) + '</button>' +
      (ui.pop === 'menu' ? '<div class="popover menu-list" role="menu"><button role="menuitem" data-act="nav" data-route="profile">' + icon('user', 17) + 'Profile</button><button role="menuitem" data-act="nav" data-route="settings">' + icon('sliders', 17) + 'Settings</button></div>' : '') + '</div>';
  }

  function bannerHead(imgId, alt, eyebrow, title, sub, right) {
    return '<section class="banner">' + ART.banner(imgId, alt) + '<div class="banner-in"><div><div class="eyebrow">' + eyebrow + '</div><h1 class="page-title">' + title + '</h1>' + (sub ? '<p class="page-sub">' + sub + '</p>' : '') + '</div>' + (right || '') + '</div></section>';
  }
  const FRANKIE_JOBS = ['debt-little-italy', 'favor-frankie'];
  function contactStrip(m) {
    return FRANKIE_JOBS.includes(m.id) ? '<div class="contact">' + ART.npc('npc_frankie', 56, 'Frankie, the shopkeeper who hands out your jobs') + '<div><small>Your contact</small><b>Frankie</b></div></div>' : '';
  }

  function head(eyebrow, title, sub, right) {
    return '<div class="page-head"><div><div class="eyebrow">' + eyebrow + '</div><h1 class="page-title">' + title + '</h1>' + (sub ? '<p class="page-sub">' + sub + '</p>' : '') + '</div>' + (right || '') + '</div>';
  }

  /* ---------- shared components ---------- */
  const dollars = (n) => money(MOB.D(n));
  const STATE_LABEL = { available: 'Ready', active: 'In progress', resolved: 'Reward waiting', claimed: 'Completed' };
  function missionCard(m) {
    const st = MOB.missionStatus(S, m, Date.now()), d = MOB.DISTRICT_BY_ID[m.district], loc = MOB.LOCATION_BY_ID[m.locationId];
    let status;
    if (st.state === 'locked') status = '<span class="status">' + icon('lock', 15) + esc(st.reason) + '</span>';
    else if (st.state === 'cooldown') status = '<span class="status cool">' + icon('clock', 15) + 'Lying low <b class="num" data-cd-until="' + S.missions[m.id].cooldownUntil + '">' + MOB.fmtClock(st.remainingMs) + '</b></span>';
    else if (st.state === 'claimed') status = '<span class="status ready">' + icon('check', 15) + 'Completed</span>';
    else if (st.state === 'resolved') status = '<span class="status ready">' + icon('award', 15) + 'Reward waiting</span>';
    else if (st.state === 'active') status = '<span class="status cool">' + icon('clock', 15) + 'In progress</span>';
    else status = '<span class="status ready">' + icon('check', 15) + 'Ready</span>';
    const dim = st.state === 'locked' || st.state === 'claimed';
    return '<article data-pg="item" class="card mission ' + (st.state === 'locked' ? 'is-locked' : '') + '">' +
      '<div class="m-banner"><div class="glyph">' + icon(m.glyph, 24) + '</div><div class="tags">' + (m.chapter ? '<span class="chip gold">Ch. ' + m.chapter + '</span>' : '<span class="chip">Repeatable</span>') + '<span class="chip ' + diffClass(m.difficulty) + '">' + m.difficulty + '</span></div></div>' +
      '<div class="m-body"><h3>' + esc(m.title) + '</h3><p class="sum">' + esc(m.summary) + '</p>' +
      '<div class="rewards"><span class="gold">' + icon('dollar', 14) + dollars(m.cash[0]) + ' to ' + dollars(m.cash[1]) + '</span><span>' + icon('star', 14) + m.xp + ' XP</span><span>' + icon('bolt', 14) + m.energy + ' energy</span><span class="loc">' + icon('pin', 14) + esc(loc.name) + '</span></div>' +
      '<div class="m-foot">' + status + '<button class="btn sm' + (dim ? ' ghost' : '') + '" data-act="open-mission" data-id="' + m.id + '">' + (st.state === 'resolved' ? 'Claim Reward' : st.state === 'active' ? 'Continue' : 'View Mission') + '</button></div></div></article>';
  }

  function thumbCard(it, mode) {
    const qty = S.inventory[it.id] || 0, owned = qty > 0, equipped = it.slot && S.equipped[it.slot] === it.id;
    const locked = MOB.playerRankIdx(S) < MOB.RANK_IDX[it.rankReq];
    const maxed = it.stackable ? qty >= MOB.CONFIG.maxStack : qty >= 1;
    let tag;
    if (mode === 'shop') tag = maxed ? '<span class="t-tag good">Owned</span>' : locked ? '<span class="t-tag bad">' + icon('lock', 11) + esc(MOB.rankName(it.rankReq)) + '</span>' : '<span class="t-price">' + money(it.priceMinor) + '</span>';
    else tag = equipped ? '<span class="t-tag gold">Equipped</span>' : owned ? '<span class="t-tag good">' + (qty > 1 ? '×' + qty : 'Owned') + '</span>' : '<span class="t-tag">Not owned</span>';
    return '<button data-pg="item" ' + (mode === 'shop' ? 'id="shop-' + it.id + '" ' : '') + 'class="thumb' + (mode === 'inv' && !owned ? ' unowned' : '') + (equipped ? ' equipped' : '') + '" data-act="open-item" data-id="' + it.id + '" data-from="' + (mode === 'shop' ? 'shop' : '') + '" aria-label="' + esc(it.name) + ' details">' +
      '<div class="art ' + (ART.itemHasPhoto(it.art) ? 'has-photo' : 'temp-art') + '">' + ART.itemArt(it.art, 64) + '</div><span class="t-name">' + esc(it.name) + '</span>' + tag + '</button>';
  }

  function itemCard(it, mode) {
    if (isPhone()) return thumbCard(it, mode);
    const qty = S.inventory[it.id] || 0, owned = qty > 0;
    const equipped = it.slot && S.equipped[it.slot] === it.id;
    const locked = MOB.playerRankIdx(S) < MOB.RANK_IDX[it.rankReq];
    let ribbon = '';
    if (mode === 'inv') ribbon = equipped ? '<span class="chip gold ribbon">Equipped</span>' : owned ? '<span class="chip good ribbon">' + (qty > 1 ? 'Owned ×' + qty : 'Owned') + '</span>' : '<span class="chip ribbon">Not owned</span>';
    if (it.rankReq !== 'newcomer') ribbon += '<span class="chip ribbon r' + (locked ? ' bad' : '') + '">' + esc(MOB.rankName(it.rankReq)) + '</span>';
    return '<button data-pg="item" class="item ' + (mode === 'inv' && !owned ? 'unowned' : '') + (equipped ? ' equipped' : '') + '" data-act="open-item" data-id="' + it.id + '">' +
      '<div class="art ' + (ART.itemHasPhoto(it.art) ? 'has-photo' : 'temp-art') + '">' + ART.itemArt(it.art, 80) + ribbon + '</div><div class="info"><h3>' + esc(it.name) + '</h3>' +
      '<div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase" class="rar-' + it.rarity + '">' + it.rarity + ' · ' + (it.slot ? MOB.SLOT_LABEL[it.slot] : it.kind === 'consumable' ? 'Consumable' : 'Everyday item') + '</div>' + bonusChips(it) + '</div></button>';
  }

  function meter(key, label, iconName, value, max, cls, note) {
    return '<div class="stat-row"><div class="lbl"><span>' + icon(iconName, 13) + ' ' + label + '</span><b>' + value + ' / ' + max + (note ? ' · ' + note : '') + '</b></div>' + bar(key, (value / max) * 100, cls, label) + '</div>';
  }

  /* ---------- pages ---------- */
  function encounterCard(en) {
    const st = MOB.encounterStatus(S, en), d = MOB.DISTRICT_BY_ID[en.district];
    const locked = st.state === 'locked';
    return '<article data-pg="item" class="card mission ' + (locked ? 'is-locked' : '') + '">' +
      '<div class="m-banner"><div class="glyph">' + icon(en.glyph, 24) + '</div><div class="tags"><span class="chip">Combat</span><span class="chip">' + esc(en.enemy.name) + '</span></div></div>' +
      '<div class="m-body"><h3>' + esc(en.title) + '</h3><p class="sum">' + esc(en.summary) + '</p>' +
      '<div class="rewards"><span class="gold">' + icon('dollar', 14) + dollars(en.cash[0]) + ' to ' + dollars(en.cash[1]) + '</span><span>' + icon('star', 14) + en.xp + ' XP</span><span>' + icon('bolt', 14) + en.energy + ' energy</span><span class="loc">' + icon('pin', 14) + esc(d.name) + '</span></div>' +
      '<div class="m-foot">' + (locked ? '<span class="status">' + icon('lock', 15) + esc(st.reason) + '</span>' : '<span class="status ready">' + icon('check', 15) + 'Ready</span>') +
      '<button class="btn sm' + (locked ? ' ghost' : '') + '" data-act="fight-start" data-id="' + en.id + '">Pick the Fight</button></div></div></article>';
  }

  function combatBanner() {
    if (!S.combat) return '';
    const en = MOB.ENCOUNTER_BY_ID[S.combat.encId];
    return '<div class="notice warn active-job" style="margin-bottom:16px">' + icon('flame', 18) + '<div style="flex:1"><b>Fight in progress: ' + esc(en.title) + '</b><div style="color:var(--muted)">Finish it before it finishes you.</div></div><button class="btn sm" data-act="open-fight">Continue</button></div>';
  }

  function fightModal() {
    const mo = ui.modal;
    let en, body, title, eyebrow;
    if (mo.result) {
      const r = mo.result; en = MOB.ENCOUNTER_BY_ID[r.encId];
      const head = { won: ['Victory', 'success', 'He is on the ground and the street has seen it.'], negotiated: ['Talked down', 'partial', 'Nobody bled and you got something for your trouble.'], escaped: ['Got away', 'partial', 'You lived to fight another day, with nothing to show for it.'], defeated: ['Knocked out', 'failure', 'You came to in an alley with your pockets lighter.'] }[r.outcome];
      body = '<div class="result"><div class="verdict ' + head[1] + '"><h3>' + head[0] + '</h3><p>' + esc(head[2]) + '</p></div>' + deltaChips({ cashMinor: r.cashMinor, xp: r.xp, respect: r.respect, heat: r.heat, cashLostMinor: r.lostMinor }) +
        (r.knockedOut ? '<div class="notice warn">' + icon('heart', 18) + '<div>Health restored to ' + MOB.CONFIG.defeatRecoveryHealth + '.</div></div>' : '') +
        (r.promotions.length ? '<div class="notice info">' + icon('star', 18) + '<div>Promoted to <b>' + esc(r.promotions[r.promotions.length - 1].rank) + '</b>.</div></div>' : '') +
        '<div class="row-end"><button class="btn ghost" data-act="close-modal">Back to the board</button></div></div>';
      eyebrow = 'Fight over'; title = en.title;
    } else if (S.combat) {
      const cb = S.combat; en = MOB.ENCOUNTER_BY_ID[cb.encId]; const o = MOB.combatOdds(S), eff = MOB.effective(S);
      const pct = (x) => Math.round(x * 100) + '%';
      const act = (d, label, desc, odds) => '<button class="approach" data-act="fight-act" data-do="' + d + '"><b>' + label + '</b>' + (odds != null ? '<div class="odds"><strong>' + pct(odds) + '</strong><span>Odds</span></div>' : '') + '<span class="d">' + desc + '</span></button>';
      const kit = S.inventory['first-aid-kit'] > 0 && S.player.health < eff.maxHealth;
      const wc = MOB.weaponCombat(S);
      body = meter('foe', esc(en.enemy.name), 'target', cb.enemyHp, cb.enemyMax, 'heat', 'Round ' + cb.round) +
        meter('hp', 'Your health', 'heart', S.player.health, eff.maxHealth, 'hp', 'He hits you about ' + pct(o.enemyHit)) +
        '<div class="paper" style="margin:12px 0;padding:10px 14px"><ul style="margin:0;padding-left:18px">' + cb.log.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' +
        '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">' + (wc ? icon('target', 13) + ' ' + esc(wc.item.name) + ' · ' + wc.band + ' (' + wc.cond + '/100)' + (wc.usable ? '' : ' · jammed, you are fighting bare-handed') : 'Fighting bare-handed. A weapon from the shop adds accuracy and damage.') + '</div>' + '<div class="eyebrow" style="margin-bottom:10px">Your move</div><div class="approaches">' +
        act('attack', 'Attack', 'Throw a punch or pull the trigger.', o.attack) +
        act('defend', 'Defend', 'Cover up. His next hit lands 30% lighter.', null) +
        act('negotiate', 'Negotiate', 'Talk him down. Uses Charisma.', o.negotiate) +
        act('escape', 'Escape', 'Break away. Uses Agility.', o.escape) +
        (kit ? '<button class="approach" data-act="fight-act" data-do="item" data-item="first-aid-kit"><b>Use First-Aid Kit (' + S.inventory['first-aid-kit'] + ')</b><span class="d">+40 health. He still gets his turn.</span></button>' : '') + '</div>';
      eyebrow = 'Street trouble · round ' + cb.round; title = en.title;
    } else {
      body = '<p>This fight is over.</p><div class="row-end"><button class="btn ghost" data-act="close-modal">Close</button></div>'; eyebrow = 'Street trouble'; title = 'Fight over';
    }
    return '<div class="modal-back" data-act="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mm-title" tabindex="-1"><div class="modal-head"><div><div class="eyebrow">' + eyebrow + '</div><h2 id="mm-title">' + esc(title) + '</h2></div>' +
      '<button class="icon-btn" data-act="close-modal" aria-label="Close">' + icon('x', 18) + '</button></div><div class="modal-body">' + body + '</div></div></div>';
  }

  function activeJobBanner() {
    const id = MOB.activeMissionId(S);
    if (!id) return '';
    const m = MOB.MISSION_BY_ID[id], pending = S.missions[id].pending;
    return '<div class="notice info active-job" style="margin-bottom:16px">' + icon(pending ? 'award' : 'clock', 18) + '<div style="flex:1"><b>' + (pending ? 'Reward waiting: ' : 'Job in progress: ') + esc(m.title) + '</b><div style="color:var(--muted);font-size:13px">' +
      (pending ? 'Claim it to be paid.' : 'Pick an approach to finish the work.') + '</div></div><button class="btn sm" data-act="open-mission" data-id="' + id + '">' + (pending ? 'Claim Reward' : 'Continue') + '</button></div>';
  }

  /* ---------- playtest notes: shown once on the dashboard, always available in Settings ---------- */
  const NOTES_KEY = 'mob_playtest_notes_seen';
  const notesSeen = () => { try { return !!store.getItem(NOTES_KEY); } catch (e) { return false; } };
  function playtestNotes(dismissable) {
    return '<section class="card playtest" id="playtest-notes" aria-label="Playtest notes" style="padding:20px;display:grid;gap:10px;margin-top:20px"><h3 data-pg="head" style="font-size:24px">Playtest notes</h3>' +
      '<p data-pg="item" style="color:var(--muted)"><b>How to play.</b> Open the Job Board, start a job, pick an approach, then claim the reward. Jobs cost energy, which comes back slowly. Pay attention to health and heat. Spend cash in the Shop, buy a business once you reach Associate, and take on street trouble when you want a fight.</p>' +
      '<p data-pg="item" style="color:var(--muted)"><b>What is unfinished.</b> This is a prototype that saves to this browser only. Prices, rewards, enemy and weapon stats are balance values that may change. Some pictures are marked TEMP ART or Photo pending. Weapon history is partly checked and not final. There is no multiplayer yet.</p>' +
      '<p data-pg="item" style="color:var(--muted)"><b>What we want to learn.</b> Where did you stop playing? What confused you? What felt too slow, too easy or boring? What would make you come back tomorrow? Send your answers to whoever shared this link. Settings has a Copy report button that adds your rank, cash and recent events.</p>' +
      (dismissable ? '<div><button class="btn ghost sm" data-act="dismiss-notes">Got it</button></div>' : '') + '</section>';
  }

  function dailyCard() {
    const d = MOB.dailyStatus(S, Date.now());
    const mins = Math.ceil(d.remainingMs / 60000), when = mins >= 60 ? Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min' : mins + ' min';
    return '<section class="card" id="daily-card" aria-label="Daily envelope" style="padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:20px">' +
      '<div><h3 style="font-size:22px">Daily envelope</h3><p style="color:var(--muted);margin:4px 0 0">' +
      (d.available ? 'A plain envelope is waiting: <b class="gold">' + money(d.cashMinor) + '</b> and ' + d.energy + ' energy' + (d.nextStreak > 1 ? ' (day ' + d.nextStreak + ' in a row, +' + (d.nextStreak - 1) * 10 + '%)' : '') + '.'
        : 'Collected. The next one is ready in ' + when + (d.streak > 1 ? '. Current streak: ' + d.streak + ' days.' : '.')) + '</p></div>' +
      '<button class="btn" data-act="claim-daily"' + (d.available ? '' : ' disabled') + '>' + icon('dollar', 16) + 'Collect</button></section>';
  }

  function pageDashboard() {
    if (isPhone()) return phoneDashboard();
    const p = S.player, eff = MOB.effective(S), pr = MOB.rankProgress(p.xp);
    const hero =
      '<section class="hero" aria-label="Welcome">' + ART.hero() + (ART.hasPhoto('bg_hero_dashboard') ? '' : '<div class="rain" aria-hidden="true"></div>') + '<div class="hero-inner">' +
      '<div class="hero-loc">Chicago, Illinois — 1931</div><h1>MOB: <span>THE</span> UNDERWORLD</h1><q>“Every empire begins in the streets.”</q>' +
      '<button class="btn big" data-act="nav" data-route="jobs">Enter the Underworld ' + icon('arrow', 18) + '</button></div></section>';

    const attrs = MOB.ATTRS.map((k) => {
      const bonus = eff.bonus[k];
      const plus = p.attrPoints > 0 && p.attrs[k] < MOB.CONFIG.attrSoftCap ? '<button class="attr-plus" data-act="spend-attr" data-attr="' + k + '" aria-label="Raise ' + MOB.ATTR_LABEL[k] + '">+</button>' : '';
      return '<div class="attr-line">' + icon(ATTR_ICON[k], 18) + '<span>' + MOB.ATTR_LABEL[k] + '</span>' + bar('a-' + k, Math.min(100, (eff[k] / MOB.CONFIG.attrSoftCap) * 100), 'attr mini', MOB.ATTR_LABEL[k]) + '<b class="num">' + p.attrs[k] + (bonus ? '<em>+' + bonus + '</em>' : '') + plus + '</b></div>';
    }).join('');
    const pointsNote = p.attrPoints > 0 ? '<div class="notice info" id="attr-note">' + icon('star', 18) + '<div><b>' + p.attrPoints + ' attribute point' + (p.attrPoints > 1 ? 's' : '') + ' to spend.</b> Press + beside one attribute.</div></div>' : '';

    const card =
      '<section class="card deco player-card" aria-label="Player status"><div class="pc-top"><div class="frame">' + portrait(p.portrait, 96) + '</div><div style="min-width:0">' +
      '<h2 class="pc-name">' + esc(p.name) + '</h2><div class="pc-meta"><span class="chip demo">Demo character</span><span class="chip gold">' + esc(pr.cur.name) + '</span><span class="chip num">' + MOB.fmtNum(p.xp) + ' XP</span></div></div></div>' +
      meter('hp', 'Health', 'heart', p.health, eff.maxHealth, 'hp', MOB.healthState(p.health)) +
      meter('en', 'Energy', 'bolt', p.energy, eff.maxEnergy, 'en', '+1 per 5 min') +
      meter('ht', 'Heat', 'flame', p.heat, MOB.CONFIG.maxHeat, 'heat', MOB.heatBand(p.heat)) +
      '<div class="stat-row"><div class="lbl"><span>Experience</span><b>' + (pr.next ? pr.into + ' / ' + pr.span : 'Top rank') + '</b></div>' + bar('xp', pr.pct, '', 'Experience toward next rank') +
      (pr.next ? '<div style="font-size:12px;color:var(--muted)">Next rank: ' + esc(pr.next.name) + ' at ' + MOB.fmtNum(pr.next.xp) + ' XP</div>' : '') + '</div>' +
      '<div class="kv"><div><small>Cash</small><b class="gold num">' + money(p.cashMinor) + '</b></div><div><small>Respect</small><b class="num">' + MOB.fmtNum(p.respect) + '</b></div></div>' +
      pointsNote + '<div style="display:grid;gap:10px">' + attrs + '</div>' +
      '<button class="btn ghost sm" data-act="patch-up"' + (p.health >= eff.maxHealth ? ' disabled' : '') + '>' + icon('cross', 15) + 'See the back-alley doctor (' + money(MOB.CONFIG.patchUpCostMinor) + ')</button></section>';

    const quick = [
      ['jobs', 'brief', 'Find a Job', 'Check the board for work that pays in cash and respect.'],
      ['city', 'map', 'Visit the City', 'Move between districts as your rank opens doors.'],
      ['inventory', 'pack', 'Open Inventory', 'Review your gear and change what you carry.'],
      ['shop', 'bag', 'Visit the Shop', 'Buy outfits, supplies and the odd revolver. No questions asked.'],
    ].map((q) => '<button class="quick" data-act="nav" data-route="' + q[0] + '"><span class="qi">' + icon(q[1], 22) + '</span><h3>' + q[2] + '</h3><p>' + q[3] + '</p></button>').join('');

    const feed = S.activity.slice(0, 8).map((a) =>
      '<li data-pg="item"><time>' + (a.kind === 'demo' ? 'Demo event' : ago(a.ts)) + '</time><span class="t ' + esc(a.kind) + '">' + esc(a.text) + '</span></li>').join('');

    const open = MOB.MISSIONS.filter((m) => { const s = MOB.missionStatus(S, m, Date.now()).state; return s === 'available' || s === 'active' || s === 'resolved'; }).slice(0, 3);
    return hero + dailyCard() + (notesSeen() ? '' : playtestNotes(true)) + '<div style="margin-top:20px">' + activeJobBanner() + '</div>' +
      '<div class="dash-top" style="margin-top:0">' + card + '<div><h2 class="sec-title sec-first">Where to next?</h2><div class="grid g2">' + quick + '</div></div></div>' +
      '<h2 class="sec-title">Open jobs <small>' + open.length + ' READY</small></h2>' + (open.length ? '<div class="grid g3">' + open.map(missionCard).join('') + '</div>' : '<div class="empty">' + icon('brief', 30) + '<h3>No jobs ready right now</h3><p>Check the Job Board for locked work and cooldowns.</p></div>') +
      '<h2 class="sec-title">Recent activity</h2><section class="paper" aria-label="Recent activity"><div class="paper-head"><h3>The Lakefront Ledger</h3><small><span>Late Edition</span><span>Chicago · 1931</span></small></div><ul class="feed">' + feed + '</ul>' +
      '<p class="paper-note">The first three entries are starter demo events. Everything after them is your own record. No other players are involved.</p></section>';
  }

  function pageJobs() {
    const now = Date.now();
    const bucket = (m) => { const s = MOB.missionStatus(S, m, now).state; return s === 'available' || s === 'active' || s === 'resolved' ? 'ready' : s === 'claimed' ? 'done' : s; };
    const list = MOB.MISSIONS.filter((m) => ui.jobFilter === 'all' || ui.jobFilter === bucket(m));
    const f = [['all', 'All jobs'], ['ready', 'Ready'], ['cooldown', 'Lying low'], ['locked', 'Locked'], ['done', 'Completed']];
    const story = list.filter((m) => m.chapter), jobs = list.filter((m) => !m.chapter);
    const chapters = [...new Set(story.map((m) => m.chapter))];
    const grid = (arr) => '<div class="grid g2">' + arr.map(missionCard).join('') + '</div>';
    return head('Chicago, 1931', 'Job Board', 'Work for Frankie Russo and his neighbors. Start a job, pick one of three approaches and claim what you earn. Every approach carries its own odds.',
      '<div class="filters" role="group" aria-label="Filter jobs">' + f.map((x) => '<button class="filter" data-act="job-filter" data-f="' + x[0] + '" aria-pressed="' + (ui.jobFilter === x[0]) + '">' + x[1] + '</button>').join('') + '</div>') +
      pgWrap(activeJobBanner() + combatBanner()) +
      (list.length ? chapters.map((c, i) => '<h2 data-pg="head" class="sec-title' + (i ? '' : ' sec-first') + '">Chapter ' + c + ' <small>' + (c === 1 ? 'ARRIVING IN CHICAGO' : c === 2 ? 'TROUBLE ON THE RIVER' : c === 3 ? 'PRESSURE FROM EVERY SIDE' : 'WHAT LOYALTY COSTS') + '</small></h2>' + grid(story.filter((m) => m.chapter === c))).join('') + (jobs.length ? '<h2 data-pg="head" class="sec-title' + (story.length ? '' : ' sec-first') + '">Repeatable jobs</h2>' + grid(jobs) : '') :
        '<div class="empty">' + icon('brief', 30) + '<h3>Nothing here right now</h3><p>No jobs match this filter. Try another one.</p><button class="btn ghost sm" data-act="job-filter" data-f="all">Show all jobs</button></div>') +
      '<h2 data-pg="head" class="sec-title">Street trouble <small>COMBAT · REPEATABLE</small></h2><div class="grid g3">' + MOB.ENCOUNTERS.map(encounterCard).join('') + '</div>' +
      (!MOB.PLANNED_MISSIONS.length ? '' : '<h2 class="sec-title">The road ahead <small>PLANNED · NOT YET PLAYABLE</small></h2><div class="roadmap">' +
      MOB.PLANNED_MISSIONS.map((c) => '<div class="card chapter"><h3>Chapter ' + c.chapter + '</h3><ol start="' + ((c.chapter - 1) * 5 + 1) + '">' + c.titles.map((t) => '<li>' + icon('lock', 12) + esc(t) + '</li>').join('') + '</ol></div>').join('') + '</div>') +
      '<p class="proto-note" style="margin-top:20px;font-size:12.5px;color:var(--muted)">Prototype note: energy, cooldowns and rewards run on your browser clock and are not secure. A multiplayer build will run them on the server.</p>';
  }

  function pageCity() {
    const p = S.player, ri = MOB.playerRankIdx(S);
    return head('Five districts', 'The City', 'Each district has its own people, jobs and dangers. Raise your rank to open the doors that stay closed to newcomers.') +
      '<div class="grid g2">' + MOB.DISTRICTS.map((d) => {
        const locked = ri < MOB.RANK_IDX[d.rankReq], here = p.district === d.id;
        const locs = MOB.LOCATIONS.filter((l) => l.district === d.id);
        return '<article data-pg="item" class="card district ' + (locked ? 'locked' : '') + (here ? ' here' : '') + '"><div class="art' + (ART.districtHasPhoto(d.art) ? '' : ' temp-art') + '">' + ART.districtArt(d.art, d.name) +
          (here ? '<span class="chip gold ribbon">You are here</span>' : locked ? '<span class="chip bad ribbon">' + icon('lock', 12) + 'Locked</span>' : '') + '</div>' +
          '<div class="info"><h3>' + d.name + '</h3><p style="color:var(--muted)">' + d.blurb + '</p><ul>' + locs.map((l) => '<li>' + esc(l.name) + '</li>').join('') + '</ul>' +
          '<div class="foot"><span class="status">' + (d.rankReq !== 'newcomer' ? icon(locked ? 'lock' : 'check', 14) + (locked ? 'Opens at ' : 'Opened at ') + esc(MOB.rankName(d.rankReq)) : 'Open from the start') + '</span>' +
          '<button class="btn sm" data-act="visit" data-id="' + d.id + '"' + (here ? ' disabled' : '') + '>' + (here ? 'Current location' : locked ? 'Locked — ' + esc(MOB.rankName(d.rankReq)) : 'Visit District') + '</button></div></div></article>';
      }).join('') + '</div>' +
      '<p style="margin-top:20px;font-size:13px;color:var(--muted)">Working a job in the district you are standing in improves your odds by 5%. Travel is free in this prototype. Locations are fictional.</p>';
  }

  function slotsPanel() {
    return '<div class="slots">' + MOB.SLOTS.map((s) => {
      const it = MOB.ITEM_BY_ID[S.equipped[s]];
      return '<div class="slot ' + (it ? 'filled' : '') + '"><small>' + MOB.SLOT_LABEL[s] + '</small>' +
        (it ? '<button class="icon-btn slot-photo" data-act="open-item" data-id="' + it.id + '" aria-label="View ' + esc(it.name) + '">' + ART.itemArt(it.art, 52) + '</button><div class="nm">' + esc(it.name) + '</div><button class="btn ghost sm" data-act="unequip" data-slot="' + s + '">Unequip</button>'
          : '<div style="height:60px;display:grid;place-items:center;color:var(--line)">' + icon('cross', 22) + '</div><div class="nm" style="color:var(--muted)">Empty</div>') + '</div>';
    }).join('') + '</div>';
  }

  const CATS = ['All', 'Weapons', 'Clothing', 'Everyday'];
  function pageInventory() {
    if (isPhone()) return phoneInventory();
    const eff = MOB.effective(S), used = MOB.slotsUsed(S.inventory), cap = MOB.CONFIG.inventorySlots;
    const items = MOB.ITEMS.filter((i) => (ui.invFilter === 'All' || i.category === ui.invFilter) && (!ui.invOwned || S.inventory[i.id]));
    const bonusSummary = MOB.ATTRS.map((k) => eff.bonus[k] ? '<span class="bonus">+' + eff.bonus[k] + ' ' + MOB.ATTR_LABEL[k] + '</span>' : '').join('') + (eff.bonus.health ? '<span class="bonus">+' + eff.bonus.health + ' Health</span>' : '');
    return head('Your gear', 'Inventory', 'Equip what suits the job. Items you do not own cannot be equipped. Equipped items still take up space.',
      '<div class="cash" aria-label="Inventory capacity">' + icon('pack', 16) + '<span class="num">' + used + ' / ' + cap + ' slots</span></div>') +
      '<h2 class="sec-title sec-first">Equipped <small>' + (bonusSummary ? '' : 'NO BONUSES YET') + '</small></h2>' + slotsPanel() +
      (bonusSummary ? '<div class="bonus-list" style="margin-top:12px"><span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);align-self:center">Total bonuses</span>' + bonusSummary + '</div>' : '') +
      '<h2 class="sec-title">Collection</h2><div class="page-head" style="margin-bottom:16px"><div class="filters" role="group" aria-label="Filter items">' +
      CATS.map((c) => '<button class="filter" data-act="inv-filter" data-f="' + c + '" aria-pressed="' + (ui.invFilter === c) + '">' + c + '</button>').join('') + '</div>' +
      '<button class="filter" data-act="inv-owned" aria-pressed="' + ui.invOwned + '">Owned only</button></div>' +
      (items.length ? '<div class="grid item-grid">' + items.map((i) => itemCard(i, 'inv')).join('') + '</div>' :
        '<div class="empty">' + icon('pack', 30) + '<h3>Nothing in this pile</h3><p>You do not own anything in this category yet.</p><button class="btn sm" data-act="nav" data-route="shop">Visit the shop</button></div>');
  }

  function pageShop() {
    const items = MOB.ITEMS.filter((i) => i.shop && (ui.shopFilter === 'All' || i.category === ui.shopFilter)).sort((a, b) => a.priceMinor - b.priceMinor);
    const ri = MOB.playerRankIdx(S);
    return '<section class="shop-front">' + ART.shopSign() + '<div class="sign"><h2>Sal\'s Back Room</h2><p>Cash only · No names · No returns</p></div></section>' +
      head('Behind the barber shop', 'Equipment Shop', 'The dealer lays his stock on a green felt table. Pay up, take it and keep walking.',
        '<div class="cash" aria-label="Your cash">' + icon('dollar', 16) + '<span class="num">' + money(S.player.cashMinor) + '</span></div>') +
      '<div class="filters" style="margin-bottom:16px" role="group" aria-label="Filter stock">' + CATS.map((c) => '<button class="filter" data-act="shop-filter" data-f="' + c + '" aria-pressed="' + (ui.shopFilter === c) + '">' + c + '</button>').join('') + '</div>' +
      '<div class="grid item-grid shop-grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">' + items.map((it) => {
        const qty = S.inventory[it.id] || 0, locked = ri < MOB.RANK_IDX[it.rankReq], maxed = it.stackable ? qty >= MOB.CONFIG.maxStack : qty >= 1;
        if (isPhone()) return thumbCard(it, 'shop');
        return '<article data-pg="item" class="card item" style="cursor:default" id="shop-' + it.id + '"><div class="art ' + (ART.itemHasPhoto(it.art) ? 'has-photo' : 'temp-art') + '">' + ART.itemArt(it.art, 88) + (it.rankReq !== 'newcomer' ? '<span class="chip ribbon r' + (locked ? ' bad' : '') + '">' + (locked ? icon('lock', 11) : '') + esc(MOB.rankName(it.rankReq)) + '</span>' : '') + '</div>' +
          '<div class="info"><h3>' + esc(it.name) + '</h3><div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase" class="rar-' + it.rarity + '">' + it.rarity + ' · ' + (it.slot ? MOB.SLOT_LABEL[it.slot] : it.kind === 'consumable' ? 'Consumable' : 'Everyday item') + (it.stackable && qty ? ' · You have ' + qty : '') + '</div>' +
          '<p style="color:var(--muted);font-size:13.5px">' + esc(it.description) + '</p>' + bonusChips(it) +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px"><span class="price">' + money(it.priceMinor) + '</span>' +
          (maxed ? '<button class="btn sm ghost" disabled>' + icon('check', 14) + 'Owned</button>' : '<button class="btn sm" data-act="buy" data-id="' + it.id + '">' + (locked ? icon('lock', 14) : '') + 'Buy</button>') + '</div></div></article>';
      }).join('') + '</div>';
  }

  function pageRankings() {
    if (cloud.on && !rankUi.failed) return pageRankingsOnline();
    const rows = MOB.leaderboard(S, ui.sort);
    const tabs = [['xp', 'Experience'], ['respect', 'Respect'], ['networth', 'Net worth']];
    const th = (k, label) => '<th class="' + (ui.sort === k ? 'sorted' : '') + '">' + label + '</th>';
    return bannerHead('bg_cardroom', 'An empty card table under a single pendant lamp, with chips, cards and a ledger', 'The Outfit\'s ledger', 'Rankings', (cloud.on && rankUi.note ? rankUi.note + ' ' : '') + 'Eight fictional demo profiles and you. These are not real players and nothing here is live.',
      '<div class="filters" role="tablist" aria-label="Sort rankings">' + tabs.map((t) => '<button class="filter" role="tab" data-act="sort" data-k="' + t[0] + '" aria-selected="' + (ui.sort === t[0]) + '">Sort by ' + t[1] + '</button>').join('') + '</div>') +
      '<div class="table-wrap"><table class="rank"><thead><tr><th>#</th><th>Player</th><th>Rank</th>' + th('xp', 'XP') + th('respect', 'Respect') + th('networth', 'Net worth') + '</tr></thead><tbody>' +
      rows.map((r) => '<tr data-pg="item" class="' + (r.isYou ? 'you' : '') + '"><td class="pos">' + r.position + '</td><td><div class="pl">' + portrait(r.portrait, 42) + '<div><b>' + esc(r.name) + '</b><div>' + (r.isYou ? '<span class="chip gold">You · demo</span>' : '<span class="chip demo">Fictional demo</span>') + '</div></div></div></td>' +
        '<td>' + esc(r.rank) + '</td><td class="' + (ui.sort === 'xp' ? 'sorted' : '') + '">' + MOB.fmtNum(r.xp) + '</td><td class="' + (ui.sort === 'respect' ? 'sorted' : '') + '">' + MOB.fmtNum(r.respect) + '</td><td class="' + (ui.sort === 'networth' ? 'sorted' : '') + '">' + money(r.networthMinor) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  function pageProfile() {
    if (isPhone()) return phoneProfile();
    const p = S.player, pr = MOB.rankProgress(p.xp);
    const rate = S.stats.attempts ? Math.round((S.stats.successes / S.stats.attempts) * 100) : null;
    const d = MOB.DISTRICT_BY_ID[p.district];
    const earned = MOB.ACHIEVEMENTS.filter((a) => S.achievements[a.id]).length;
    const flags = Object.keys(S.flags);
    const ledger = S.ledger.slice(0, 8);
    return bannerHead('bg_dossier_desk', 'A detective\'s desk with case folders, photographs, a fountain pen and a black telephone', 'Dossier', 'Profile', null) +
      '<section class="card deco profile-head"><div class="frame">' + portrait(p.portrait, 150) + '</div><div style="min-width:0"><h2 class="pc-name" style="font-size:34px">' + esc(p.name) + '</h2>' +
      '<div class="pc-meta"><span class="chip demo">Demo character</span><span class="chip gold">' + esc(pr.cur.name) + '</span><span class="chip">' + MOB.healthState(p.health) + '</span><span class="chip">' + MOB.heatBand(p.heat) + ' heat</span></div></div>' +
      '<button class="btn ghost" data-act="edit-profile">Edit Profile</button></section>' +
      '<div class="grid g4" style="margin-top:16px">' +
      '<div class="kv" style="grid-template-columns:1fr"><div><small>Experience</small><b class="num">' + MOB.fmtNum(p.xp) + (pr.next ? ' / ' + MOB.fmtNum(pr.next.xp) : '') + '</b></div></div>' +
      '<div class="kv" style="grid-template-columns:1fr"><div><small>Respect</small><b class="num">' + MOB.fmtNum(p.respect) + '</b></div></div>' +
      '<div class="kv" style="grid-template-columns:1fr"><div><small>Jobs resolved</small><b class="num">' + S.stats.attempts + '</b></div></div>' +
      '<div class="kv" style="grid-template-columns:1fr"><div><small>Success rate</small><b class="num">' + (rate == null ? 'No jobs yet' : rate + '%') + '</b></div></div></div>' +
      '<div class="kv" style="margin-top:12px"><div><small>Current district</small><b>' + esc(d.name) + '</b></div><div><small>Net worth</small><b class="gold num">' + money(MOB.netWorthMinor(S)) + '</b></div></div>' +
      '<h2 class="sec-title">Equipped items</h2>' + slotsPanel() +
      '<h2 class="sec-title">Story so far <small>' + flags.length + ' OF ' + Object.keys(MOB.FLAGS).length + ' FLAGS</small></h2>' +
      (flags.length ? '<div class="bonus-list">' + flags.map((f) => '<span class="bonus">' + esc(MOB.FLAGS[f]) + '</span>').join('') + '</div>' : '<p style="color:var(--muted)">Nothing yet. Finish jobs on the board and the story will start to remember you.</p>') +
      '<h2 class="sec-title">Recent transactions</h2>' + (ledger.length ? '<div class="table-wrap"><table class="rank" style="min-width:0"><tbody>' + ledger.map((e) => '<tr><td style="width:120px;color:var(--muted)">' + ago(e.ts) + '</td><td>' + esc(e.ref) + '</td><td style="text-align:right;color:' + (e.amountMinor < 0 ? 'var(--bad)' : 'var(--gold)') + '">' + (e.amountMinor < 0 ? '−' : '+') + money(Math.abs(e.amountMinor)) + '</td></tr>').join('') + '</tbody></table></div>' : '<p style="color:var(--muted)">No money has changed hands yet.</p>') +
      '<h2 class="sec-title">Achievements <small>' + earned + ' OF ' + MOB.ACHIEVEMENTS.length + '</small></h2><div class="grid g3">' +
      MOB.ACHIEVEMENTS.map((a) => {
        const on = S.achievements[a.id];
        return '<div data-pg="item" class="ach ' + (on ? '' : 'off') + '"><div class="ai">' + icon(on ? 'award' : 'lock', 20) + '</div><div><b>' + esc(a.title) + '</b><span>' + esc(a.desc) + '</span></div></div>';
      }).join('') + '</div>';
  }

  function businessCard(b) {
    const st = MOB.businessStatus(S, b), d = MOB.DISTRICT_BY_ID[b.district], own = S.businesses[b.id];
    const lm = MOB.levelMult(own ? own.level : 1), gr = Math.round(b.grossMinorPerDay * lm), ex = Math.round(b.expenseMinorPerDay * lm);
    const perDay = '<div class="rewards"><span class="gold">' + icon('dollar', 14) + money(gr) + ' income / day</span><span>' + icon('flame', 14) + money(ex) + ' expenses / day</span><span>' + icon('star', 14) + 'Net ' + money(gr - ex) + ' / day</span><span>' + icon('pin', 14) + esc(d.name) + '</span></div>';
    let foot;
    if (st.state === 'owned') {
      const a = MOB.businessAccrual(S, b.id, Date.now());
      foot = '<div class="notice info" style="margin:8px 0">' + icon('dollar', 18) + '<div>Waiting: <b class="num" data-biz="' + b.id + '" data-k="netMinor">' + money(a.netMinor) + '</b> net' + (a.capped ? ' · <b>full, collect now</b>' : '') + '<div style="color:var(--muted);font-size:12.5px">Level ' + own.level + ' · ' + esc(MOB.BUSINESS_LEVELS[own.level - 1]) + '. Income stops building after 24 hours.</div></div></div>' +
        '<div class="m-foot"><span class="status ready">' + icon('check', 15) + 'Owned</span><span style="display:flex;gap:8px">' + (own.level < 5 ? '<button class="btn sm ghost" data-act="upgrade-biz" data-id="' + b.id + '" title="Needs ' + esc(MOB.rankName(MOB.BUSINESS_LEVEL_RANK[own.level])) + '">Upgrade · ' + money(MOB.upgradeCostMinor(b, own.level)) + '</button>' : '') + '<button class="btn sm" data-act="collect" data-id="' + b.id + '">Collect</button></span></div>';
    } else if (st.state === 'locked') foot = '<div class="m-foot"><span class="status">' + icon('lock', 15) + esc(st.reason) + '</span><button class="btn sm ghost" data-act="buy-biz" data-id="' + b.id + '">Buy · ' + money(b.priceMinor) + '</button></div>';
    else foot = '<div class="m-foot"><span class="status ready">' + icon('check', 15) + 'For sale</span><button class="btn sm" data-act="buy-biz" data-id="' + b.id + '">Buy · ' + money(b.priceMinor) + '</button></div>';
    return '<article class="card mission ' + (st.state === 'locked' ? 'is-locked' : '') + '"><div class="biz-art' + (ART.businessHasPhoto(b.id) ? '' : ' temp-art') + '">' + ART.businessArt(b.id) + '<span class="chip ribbon" style="position:absolute;top:10px;left:10px">' + (st.state === 'owned' ? 'Owned' : 'Fictional business') + '</span></div>' +
      '<div class="m-body"><h3>' + esc(b.name) + '</h3><p class="sum">' + esc(b.description) + '</p>' + perDay + foot + '</div></article>';
  }

  function pageBusinesses() {
    const owned = MOB.BUSINESSES.filter((b) => S.businesses[b.id]);
    const net = owned.reduce((n, b) => n + Math.round((b.grossMinorPerDay - b.expenseMinorPerDay) * MOB.levelMult(S.businesses[b.id].level)), 0);
    return head('Chicago, 1931', 'Businesses', 'Buy a stake in the neighborhood. Income builds up on its own clock, up to 24 hours at a time. Collect it before it stops, and the expenses come out with it.',
      '<div data-pg="item" class="notice info" style="margin-bottom:16px">' + icon('info', 18) + '<div>' + owned.length + ' of ' + MOB.BUSINESSES.length + ' owned · Net <b class="num">' + money(net) + '</b> per day. These are fictional game-balance numbers. In this prototype the income clock runs on your browser clock.</div></div>') +
      '<div class="grid g2">' + MOB.BUSINESSES.map(businessCard).join('') + '</div>';
  }

  function reportCard() {
    return '<section class="card" id="report-card" aria-label="Playtest report" style="padding:20px;display:grid;gap:10px;margin-top:20px"><h3 style="font-size:24px">Send a playtest report</h3>' +
      '<p style="color:var(--muted)">Write what happened or what you think, then copy the report and paste it to whoever shared this link. It lists your rank, cash, recent events and the browser you use. Nothing is sent anywhere automatically.</p>' +
      '<label for="report-note" style="font-size:13px;color:var(--muted)">Your note (where you stopped, what confused you, what was boring or great)</label>' +
      '<textarea id="report-note" rows="4" maxlength="2000" style="width:100%;background:var(--bg2);color:inherit;border:1px solid var(--line);border-radius:3px;padding:10px;font:inherit"></textarea>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="copy-report">' + icon('book', 16) + 'Copy report</button></div>' +
      '<textarea id="report-out" rows="6" readonly aria-label="Report text" style="display:none;width:100%;background:var(--bg2);color:inherit;border:1px solid var(--line);border-radius:3px;padding:10px;font:12px/1.4 monospace"></textarea></section>';
  }

  function settingsParts() {
    return {
      account: !CLOUD_ENABLED ? '' : cloud.on
        ? '<section class="card" style="padding:20px;display:grid;gap:12px;align-content:start"><h3 style="font-size:24px">Your account</h3><p style="color:var(--muted)">Signed in as <b>' + esc((cloud.session && cloud.session.email) || '') + '</b>. Your progress is stored on the server.</p><div><button class="btn ghost" data-act="sign-out">Sign out</button></div></section>'
        : '<section class="card" style="padding:20px;display:grid;gap:12px;align-content:start"><h3 style="font-size:24px">Play online</h3><p style="color:var(--muted)">You are in the offline demo. Sign in to keep your progress on the server and play from any device. The offline demo save stays here.</p><div><button class="btn" data-act="go-online">Sign in</button></div></section>',
      reset: '<section class="card" style="padding:20px;display:grid;gap:12px;align-content:start"><h3 style="font-size:24px">Reset demo</h3>' +
        '<p style="color:var(--muted)">Wipe your progress and start again as Tommy Malone: Newcomer, ' + money(MOB.CONFIG.startCashMinor) + ', full health and energy, no heat and no firearm. This cannot be undone.</p>' +
        '<div><button class="btn danger" data-act="reset-ask">' + icon('refresh', 16) + 'Reset Demo</button></div></section>',
      about: '<section class="card" style="padding:20px;display:grid;gap:10px;align-content:start"><h3 style="font-size:24px">About this prototype</h3>' +
        '<p style="color:var(--muted)">' + (persistent ? 'Progress saves automatically to this browser and survives a refresh.' : 'Your browser blocks local storage here, so progress lasts only until you close this page.') + '</p>' +
        '<p style="color:var(--muted)">Energy, cooldowns, rewards and prices run on your own device. They are not secure and are not shared with other players.</p>' +
        '<p style="color:var(--muted)">There are no accounts, no server and no multiplayer. Rankings are fictional demo profiles. Game money is fictional and has no real-world value.</p></section>',
    };
  }
  function pageSettings() {
    if (isPhone()) return phoneSettings();
    const p = settingsParts();
    return head('Housekeeping', 'Settings', 'Everything in this prototype is stored in your browser only.') +
      '<div class="grid g2">' + (cloud.on ? p.account : p.account + p.reset) + p.about + '</div>' + playtestNotes(false) + reportCard();
  }

  /* ---------- phone: one screen per page ----------
     On a phone each page fits the screen. Composite pages use sub-tabs; long lists are cut into pages by measurement
     (applyPaging) so a page holds exactly as many cards as fit. Desktop is untouched. */
  const PHONE_MQ = window.matchMedia('(max-width: 700px)');
  const isPhone = () => PHONE_MQ.matches;
  const pgWrap = (h) => (h ? '<div data-pg="item">' + h + '</div>' : '');
  const curSub = (page, def) => ui.sub[page] || def;
  function subTabs(page, tabs) {
    const cur = curSub(page, tabs[0][0]);
    return '<div class="subtabs" role="tablist" aria-label="Sections">' + tabs.map((t) => '<button role="tab" class="subtab" data-act="subtab" data-page="' + page + '" data-id="' + t[0] + '" aria-selected="' + (cur === t[0]) + '">' + t[1] + (t[2] ? '<i class="dot" aria-hidden="true"></i>' : '') + '</button>').join('') + '</div>';
  }
  const pgKey = () => [ui.route, ui.sub[ui.route] || '', ui.jobFilter, ui.shopFilter, ui.invFilter, ui.invOwned, ui.sort].join('|');
  let pgState = { key: '', idx: 0, pages: 1 };
  function applyPaging() {
    const main = $('#view');
    main.querySelectorAll('.pager').forEach((e) => e.remove());
    main.classList.remove('has-pager');
    const items = [...main.querySelectorAll('[data-pg]')];
    items.forEach((i) => i.classList.remove('pg-hide'));
    if (!isPhone() || !items.length) return;
    const key = pgKey();
    if (pgState.key !== key) pgState = { key, idx: 0, pages: 1 };
    const pager = document.createElement('div');
    pager.className = 'pager';
    pager.innerHTML = '<button class="btn ghost sm" data-act="pg-prev">‹ Back</button><span class="pg-count num"></span><button class="btn ghost sm" data-act="pg-next">Next ›</button>';
    main.appendChild(pager);
    main.classList.add('has-pager');
    const limit = pager.getBoundingClientRect().top - 6;
    const pages = [];
    let start = 0;
    while (start < items.length) {
      items.forEach((it, i) => it.classList.toggle('pg-hide', i < start));
      let end = start;
      for (let i = start; i < items.length; i++) {
        if (items[i].getBoundingClientRect().bottom > limit && i > start) break;
        end = i + 1;
      }
      while (end - start > 1 && end < items.length && items[end - 1].dataset.pg === 'head') end--;
      pages.push([start, end]);
      start = end;
    }
    if (pages.length <= 1) { items.forEach((i) => i.classList.remove('pg-hide')); pager.remove(); main.classList.remove('has-pager'); pgState.pages = 1; return; }
    pgState.pages = pages.length;
    pgState.idx = Math.max(0, Math.min(pgState.idx, pages.length - 1));
    const [a, b] = pages[pgState.idx];
    items.forEach((it, i) => it.classList.toggle('pg-hide', i < a || i >= b));
    pager.querySelector('.pg-count').textContent = (pgState.idx + 1) + ' / ' + pages.length;
    pager.querySelector('[data-act=pg-prev]').disabled = pgState.idx === 0;
    pager.querySelector('[data-act=pg-next]').disabled = pgState.idx === pages.length - 1;
    const sc = main.firstElementChild; if (sc) sc.scrollTop = 0;
  }
  function pgStep(d) {
    if (pgState.pages <= 1) return false;
    const n = Math.max(0, Math.min(pgState.pages - 1, pgState.idx + d));
    if (n === pgState.idx) return false;
    pgState.idx = n; applyPaging(); return true;
  }

    err.textContent = ''; e.target.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    try {
      const r = await signIn(email, pass, create);
      if (r.ok) await startCloud(); else { showAuth(r.error); document.getElementById('au-email').value = email; }
    } catch (er) { showAuth(friendly(er)); document.getElementById('au-email').value = email; }
  });
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    if (t.dataset.act === 'auth-create') { const f = document.getElementById('auth-form'); f.dataset.creating = '1'; f.requestSubmit(); }
    else if (t.dataset.act === 'auth-offline') goOffline();
    else if (t.dataset.act === 'sign-out') signOutCloud();
    else if (t.dataset.act === 'go-online') { if (cloud.session) startCloud(); else showAuth(''); }
  });
  /* keep the view fresh: pull the server state now and then and when the tab comes back */
  async function cloudRefresh() {
    if (!cloud.on || cloud.busy || ui.resolving || document.hidden || (ui.modal && ui.modal.type === 'profile')) return;
    try { const next = await pullState(); if (next && !cloud.busy) { S = next; saveExtras(); render(); } } catch (e) { if (e.signedOut) showAuth(friendly(e)); }
  }
  setInterval(cloudRefresh, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) cloudRefresh(); });

  /* ---------- crews (online only) ---------- */
  const crewUi = { data: null, browse: null, loading: false, err: '', ask: null, loadedFor: null };
  const ROLE_NAME = { member: 'Member', recruiter: 'Recruiter', officer: 'Officer', leader: 'Leader' };
  const ROLE_ORD = { member: 1, recruiter: 2, officer: 3, leader: 4 };
  async function loadCrew(quiet) {
    if (!cloud.on) return;
    if (!quiet) { crewUi.loading = true; render(); }
    try {
      const st = await rpc('game_crew_state');
      crewUi.data = st.ok ? st : null; crewUi.err = st.ok ? '' : (st.error || 'Could not load your crew.');
      crewUi.browse = (st.ok && !st.crew) ? (await rpc('game_crew_browse')).crews || [] : null;
      crewUi.loadedFor = cloud.session && cloud.session.email;
    } catch (e) {
      if (e.signedOut) { showAuth(friendly(e)); return; }
      crewUi.err = (e.status === 404 || /could not find|function/i.test(e.message || '')) ? 'Crews need the latest database update (migration 0007). Ask whoever runs the game to install it.' : friendly(e);
    } finally { crewUi.loading = false; if (ui.route === 'crew') render(); }
  }
  async function crewCall(fn, args, okMsg) {
    if (cloud.busy) return false;
    cloud.busy = true; document.body.classList.add('busy');
    let ok = false;
    try {
      const r = await rpc(fn, Object.assign({ p_key: newKey() }, args));
      if (!r || !r.ok) toast((r && r.error) || 'That did not work.', 'error');
      else { ok = true; toast(okMsg, 'success'); }
      crewUi.ask = null;
      try { const next = await pullState(); if (next) { S = next; saveExtras(); } } catch (e) { /* the crew view still refreshes */ }
      await loadCrew(true);
    } catch (e) { if (e.signedOut) showAuth(friendly(e)); else toast(friendly(e), 'error'); }
    finally { cloud.busy = false; document.body.classList.remove('busy'); render(); }
    return ok;
  }
  const dollarsToMinor = (v) => { const n = Math.round(parseFloat(String(v).replace(/[$,\s]/g, '')) * 100); return Number.isFinite(n) && n > 0 ? n : 0; };
  const valOf = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
  const askRow = (act, id, label, extra) => (crewUi.ask && crewUi.ask.act === act && crewUi.ask.id === (id || '')
    ? '<span class="ask">Sure? <button class="btn sm danger" data-act="crew-' + act + '-yes" data-id="' + esc(id || '') + '"' + (extra || '') + '>Yes</button> <button class="btn sm ghost" data-act="crew-ask-no">No</button></span>'
    : '<button class="btn sm ghost" data-act="crew-ask" data-ask="' + act + '" data-id="' + esc(id || '') + '"' + (extra || '') + '>' + label + '</button>');

  function crewCard(inner) { return '<section class="card" data-pg="item" style="padding:16px;display:grid;gap:10px;align-content:start">' + inner + '</section>'; }
  function crewNone(d) {
    const cfg = d.config, myRank = MOB.rankForXp(S.player.xp).name;
    const inv = (d.invitations || []).map((r) => crewCard('<b>' + esc(r.crew_name) + '</b><span style="color:var(--muted)">Invited by ' + esc(r.from) + '</span><div style="display:flex;gap:8px"><button class="btn sm" data-act="crew-respond" data-id="' + r.id + '" data-yes="1">Accept</button><button class="btn sm ghost" data-act="crew-respond" data-id="' + r.id + '" data-yes="0">Decline</button></div>')).join('');
    const apps = new Set((d.applications || []).map((a) => a.crew_id));
    const mine = (d.applications || []).map((r) => crewCard('<b>' + esc(r.crew_name) + '</b><span style="color:var(--muted)">Your application is waiting.</span><div><button class="btn sm ghost" data-act="crew-cancel" data-id="' + r.id + '">Withdraw</button></div>')).join('');
    const list = (crewUi.browse || []).map((c) => crewCard('<div style="display:flex;justify-content:space-between;gap:8px"><b>' + esc(c.name) + '</b><span class="chip">' + c.members + ' / ' + c.capacity + '</span></div>' +
      (c.description ? '<p style="color:var(--muted);font-size:13.5px">' + esc(c.description) + '</p>' : '') + '<span style="color:var(--muted);font-size:13px">Led by ' + esc(c.leader) + '</span>' +
      '<div>' + (apps.has(c.id) ? '<button class="btn sm ghost" disabled>Applied</button>' : c.full ? '<button class="btn sm ghost" disabled>Full</button>' : '<button class="btn sm" data-act="crew-apply" data-id="' + c.id + '">Apply</button>') + '</div>')).join('');
    const sub = curSub('crew', inv ? 'invites' : 'browse');
    const tabs = isPhone() ? subTabs('crew', [['browse', 'Crews'], ['invites', 'Invites' + ((d.invitations || []).length ? ' ' + d.invitations.length : '')], ['found', 'Found']]) : '';
    const form = crewCard('<h3 style="font-size:20px">Found a crew</h3><p style="color:var(--muted);font-size:13.5px">Costs ' + money(Number(cfg.fee_minor)) + '. Needs the rank of ' + esc(cfg.min_rank_name) + ' (you are ' + esc(myRank) + '). Up to ' + cfg.capacity + ' members. The name cannot be changed later.</p>' +
      '<input id="crew-name" class="inp" maxlength="24" placeholder="Crew name (3 to 24 characters)" autocomplete="off">' +
      '<textarea id="crew-desc" class="inp" maxlength="300" rows="2" placeholder="What is the crew about? (optional)"></textarea>' +
      '<div><button class="btn" data-act="crew-create">Found the crew</button></div>');
    const invs = inv + mine || '<p style="color:var(--muted)">No invitations or applications right now.</p>';
    if (isPhone()) return tabs + (sub === 'invites' ? invs : sub === 'found' ? form : (list || '<div class="empty"><h3>No crews yet</h3><p>Be the first to found one.</p></div>'));
    return (inv || mine ? '<h2 class="sec-title">Your invitations and applications</h2><div class="grid g3">' + inv + mine + '</div>' : '') + '<h2 class="sec-title">Crews you can join</h2>' +
      (list ? '<div class="grid g3">' + list + '</div>' : '<p style="color:var(--muted)">No crews yet. Be the first to found one.</p>') + '<h2 class="sec-title">Start your own</h2><div class="grid g2">' + form + '</div>';
  }
  function crewIn(d) {
    const c = d.crew, me = d.me, cfg = d.config, myOrd = ROLE_ORD[me.role];
    const mem = d.members.map((m) => {
      const isMe = m.id === me.id, lower = ROLE_ORD[m.role] < myOrd;
      let acts = '';
      if (!isMe && me.is_leader) {
        acts += ['member', 'recruiter', 'officer'].filter((r) => r !== m.role).map((r) => '<button class="btn sm ghost" data-act="crew-role" data-id="' + m.id + '" data-role="' + r + '">Make ' + ROLE_NAME[r] + '</button>').join('') + askRow('transfer', m.id, 'Hand over lead');
      }
      if (!isMe && me.can_kick && lower) acts += askRow('kick', m.id, 'Remove');
      return '<article data-pg="item" class="card" style="padding:12px;display:grid;gap:8px"><div class="pl" style="display:flex;gap:10px;align-items:center">' + portrait(m.portrait, 40) + '<div style="min-width:0"><b>' + esc(m.name) + (isMe ? ' (you)' : '') + '</b><div style="color:var(--muted);font-size:13px">' + esc(m.rank) + '</div></div><span class="chip' + (m.role === 'leader' ? ' gold' : '') + '" style="margin-left:auto">' + ROLE_NAME[m.role] + '</span></div>' + (acts ? '<div style="display:flex;gap:6px;flex-wrap:wrap">' + acts + '</div>' : '') + '</article>';
    }).join('');
    const reqs = (d.requests || []).map((r) => crewCard('<b>' + esc(r.name) + '</b><span style="color:var(--muted)">' + (r.kind === 'application' ? 'Wants to join' : 'Invited by ' + esc(r.by)) + '</span><div style="display:flex;gap:8px;flex-wrap:wrap">' +
      (r.kind === 'application' ? '<button class="btn sm" data-act="crew-respond" data-id="' + r.id + '" data-yes="1">Accept</button><button class="btn sm ghost" data-act="crew-respond" data-id="' + r.id + '" data-yes="0">Decline</button>' : '') +
      '<button class="btn sm ghost" data-act="crew-cancel" data-id="' + r.id + '">' + (r.kind === 'application' ? 'Dismiss' : 'Cancel invite') + '</button></div>')).join('');
    const invite = me.can_recruit ? crewCard('<h3 style="font-size:18px">Invite a player</h3><input id="crew-invite-name" class="inp" maxlength="30" placeholder="Exact character name" autocomplete="off"><div><button class="btn sm" data-act="crew-invite">Send invitation</button></div>') : '';
    const led = d.ledger.map((l) => '<tr data-pg="item"><td style="width:90px;color:var(--muted)">' + ago(l.at) + '</td><td>' + esc(l.type) + (l.by ? ' · ' + esc(l.by) : '') + '</td><td style="text-align:right;color:' + (l.amount_minor < 0 ? 'var(--bad)' : 'var(--gold)') + '">' + (l.amount_minor < 0 ? '−' : '+') + money(Math.abs(Number(l.amount_minor))) + '</td></tr>').join('');
    const treasury = crewCard('<div class="kv" style="grid-template-columns:1fr"><div><small>Crew treasury</small><b class="gold num">' + money(Number(c.treasury_minor)) + '</b></div></div>' +
      '<input id="crew-amt" class="inp" inputmode="decimal" placeholder="Amount in dollars" autocomplete="off"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="crew-deposit">Deposit</button>' + (me.can_withdraw ? '<button class="btn sm ghost" data-act="crew-withdraw">Withdraw</button>' : '') + '</div>' +
      '<p style="color:var(--muted);font-size:12.5px">Anyone in the crew can deposit. Only the leader can withdraw.</p>') +
      (led ? '<div class="table-wrap"><table class="rank" style="min-width:0"><tbody>' + led + '</tbody></table></div>' : '<p style="color:var(--muted)">No treasury activity yet.</p>');
    const feed = d.activity.length ? d.activity.map((a) => '<div data-pg="item" class="card" style="padding:10px 12px"><span style="color:var(--muted);font-size:12.5px">' + ago(a.at) + '</span><div>' + esc(a.text) + '</div></div>').join('') : '<p style="color:var(--muted)">Nothing has happened yet.</p>';
    const about = crewCard('<h3 style="font-size:20px">' + esc(c.name) + '</h3><p style="color:var(--muted)">' + (c.description ? esc(c.description) : 'No description yet.') + '</p><span class="chip">' + d.members.length + ' / ' + c.capacity + ' members</span>' +
      (me.can_recruit ? '<textarea id="crew-desc-edit" class="inp" maxlength="300" rows="2" placeholder="New description">' + esc(c.description || '') + '</textarea><div><button class="btn sm ghost" data-act="crew-update">Save description</button></div>' : '') +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (me.is_leader ? askRow('disband', '', 'Disband crew') : askRow('leave', '', 'Leave crew')) + '</div>' +
      (me.is_leader ? '<p style="color:var(--muted);font-size:12.5px">Leaders must hand over the crew (or empty the treasury and disband) before leaving.</p>' : ''));
    const nReq = (d.requests || []).length;
    const tabs = [['members', 'Members'], ['requests', 'Requests' + (nReq ? ' ' + nReq : '')], ['treasury', 'Treasury'], ['feed', 'Feed'], ['about', 'About']];
    const sub = curSub('crew', 'members');
    const sections = { members: mem, requests: (me.can_recruit ? invite + (reqs || '<p style="color:var(--muted)">No requests waiting.</p>') : '<p style="color:var(--muted)">Only recruiters and officers see requests.</p>'), treasury, feed, about };
    if (isPhone()) return subTabs('crew', tabs) + sections[sub];
    const T = { members: 'Members', requests: 'Requests', treasury: 'Treasury', feed: 'Feed', about: 'About the crew' };
    return ['members', 'requests', 'treasury', 'feed', 'about'].map((k) => '<h2 class="sec-title">' + T[k] + '</h2>' + (k === 'members' ? '<div class="grid g3">' + sections[k] + '</div>' : k === 'requests' ? '<div class="grid g3">' + sections[k] + '</div>' : sections[k])).join('');
  }
  function pageCrew() {
    if (!cloud.on) {
      return head('The Outfit', 'Crew', 'Crews are shared with other real players.') + '<section class="card" style="padding:20px;display:grid;gap:10px"><h3 style="font-size:22px">Sign in to use crews</h3><p style="color:var(--muted)">Crews live on the server so every member sees the same crew. Switch to your online account to found or join one.</p>' +
        (CLOUD_ENABLED ? '<div><button class="btn" data-act="go-online">Go online</button></div>' : '<p style="color:var(--muted)">This offline copy has no online mode.</p>') + '</section>';
    }
    if (crewUi.loadedFor !== (cloud.session && cloud.session.email) && !crewUi.loading) setTimeout(() => loadCrew(), 0);
    const h = head('The Outfit', crewUi.data && crewUi.data.crew ? crewUi.data.crew.name : 'Crew', 'A crew is a few players working together with a shared purse.');
    if (crewUi.err) return h + '<section class="card" style="padding:18px"><p>' + esc(crewUi.err) + '</p><button class="btn sm" data-act="crew-reload">Try again</button></section>';
    if (!crewUi.data) return h + '<p style="color:var(--muted)">Loading your crew…</p>';
    return h + (crewUi.data.crew ? crewIn(crewUi.data) : crewNone(crewUi.data));
  }
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act^="crew-"]'); if (!t) return;
    const a = t.dataset.act, id = t.dataset.id;
    if (a === 'crew-reload') { crewUi.err = ''; loadCrew(); }
    else if (a === 'crew-ask') { crewUi.ask = { act: t.dataset.ask, id: id || '' }; render(); }
    else if (a === 'crew-ask-no') { crewUi.ask = null; render(); }
    else if (a === 'crew-create') crewCall('game_crew_create', { p_name: valOf('crew-name'), p_description: valOf('crew-desc') }, 'Crew founded.');
    else if (a === 'crew-apply') crewCall('game_crew_apply', { p_crew_id: id }, 'Application sent.');
    else if (a === 'crew-invite') { const n = valOf('crew-invite-name').trim(); if (!n) { toast('Type the exact name of the player.', 'error'); return; } crewCall('game_crew_invite', { p_player_name: n }, 'Invitation sent.'); }
    else if (a === 'crew-respond') crewCall('game_crew_respond', { p_request_id: Number(id), p_accept: t.dataset.yes === '1' }, t.dataset.yes === '1' ? 'Accepted.' : 'Declined.');
    else if (a === 'crew-cancel') crewCall('game_crew_cancel_request', { p_request_id: Number(id) }, 'Done.');
    else if (a === 'crew-role') crewCall('game_crew_set_role', { p_player_id: id, p_role: t.dataset.role }, 'Role changed.');
    else if (a === 'crew-kick-yes') crewCall('game_crew_kick', { p_player_id: id }, 'Member removed.');
    else if (a === 'crew-transfer-yes') crewCall('game_crew_transfer', { p_player_id: id }, 'You handed over the crew.');
    else if (a === 'crew-leave-yes') crewCall('game_crew_leave', {}, 'You left the crew.');
    else if (a === 'crew-disband-yes') crewCall('game_crew_disband', {}, 'Crew disbanded.');
    else if (a === 'crew-update') crewCall('game_crew_update', { p_description: valOf('crew-desc-edit') }, 'Description saved.');
    else if (a === 'crew-deposit' || a === 'crew-withdraw') {
      const m = dollarsToMinor(valOf('crew-amt')); if (!m) { toast('Enter an amount in dollars.', 'error'); return; }
      crewCall(a === 'crew-deposit' ? 'game_crew_deposit' : 'game_crew_withdraw', { p_amount_minor: m }, a === 'crew-deposit' ? 'Deposited.' : 'Withdrawn.');
    }
  });

  /* ---------- real rankings (online) ---------- */
  const rankUi = { data: null, sort: null, at: 0, loading: false, failed: false, note: '' };
  async function loadRank() {
    if (!cloud.on || rankUi.loading) return;
    rankUi.loading = true; const want = ui.sort;
    try { const r = await rpc('game_rankings', { p_sort: want }); if (r && r.ok) { rankUi.data = r; rankUi.sort = want; rankUi.at = Date.now(); rankUi.failed = false; } }
    catch (e) { if (e.signedOut) { showAuth(friendly(e)); } else if (e.status === 404) { rankUi.failed = true; rankUi.note = 'Real rankings need the latest database update (migration 0008), so demo profiles are shown.'; } }
    finally { rankUi.loading = false; if (ui.route === 'rankings') render(); }
  }
  function pageRankingsOnline() {
    if ((rankUi.sort !== ui.sort || Date.now() - rankUi.at > 30000) && !rankUi.loading) setTimeout(loadRank, 0);
    const tabs = [['xp', 'Experience'], ['respect', 'Respect'], ['networth', 'Net worth']];
    const th = (k, label) => '<th class="' + (ui.sort === k ? 'sorted' : '') + '">' + label + '</th>';
    const rows = rankUi.data && rankUi.sort === ui.sort ? rankUi.data.rows : (rankUi.data ? rankUi.data.rows : null);
    const sub = rankUi.data ? 'Real players, live from the server. ' + rankUi.data.total + ' on the books.' : 'Loading the ledger…';
    return head('The Outfit\'s ledger', 'Rankings', sub) +
      '<div class="filters" role="tablist" aria-label="Sort rankings">' + tabs.map((t) => '<button class="filter" role="tab" data-act="sort" data-k="' + t[0] + '" aria-selected="' + (ui.sort === t[0]) + '">Sort by ' + t[1] + '</button>').join('') + '</div>' +
      (rows ? '<div class="table-wrap"><table class="rank"><thead><tr><th>#</th><th>Player</th><th>Rank</th>' + th('xp', 'XP') + th('respect', 'Respect') + th('networth', 'Net worth') + '</tr></thead><tbody>' +
        rows.map((r) => '<tr data-pg="item" class="' + (r.is_you ? 'you' : '') + '"><td class="pos">' + r.position + '</td><td><div class="pl">' + portrait(r.portrait, 42) + '<div><b>' + esc(r.name) + '</b><div>' + (r.is_you ? '<span class="chip gold">You</span> ' : '') + (r.crew ? '<span class="chip">' + esc(r.crew) + '</span>' : '') + '</div></div></div></td>' +
          '<td>' + esc(r.rank) + '</td><td class="' + (ui.sort === 'xp' ? 'sorted' : '') + '">' + MOB.fmtNum(r.xp) + '</td><td class="' + (ui.sort === 'respect' ? 'sorted' : '') + '">' + MOB.fmtNum(r.respect) + '</td><td class="' + (ui.sort === 'networth' ? 'sorted' : '') + '">' + money(Number(r.networth_minor)) + '</td></tr>').join('') + '</tbody></table></div>' : '');
  }

  /* ---------- boot ---------- */
  render();
  if (loaded.status === 'recovered') toast('Your saved game could not be read, so a fresh demo was started.', 'error');
  save();
  if (CLOUD_ENABLED) { if (cloud.session) startCloud(); else if (store.getItem(K_MODE) !== 'local') showAuth(''); }
})();
</script>
</body></html>
