          text: { success: 'You walk in with three men and walk out with the ledger. The vault manager decides he saw nothing.', failure: 'The bank guards were expecting trouble. You get out through a window, bleeding.' } },
      ],
    },
  ];
  const MISSION_BY_ID = Object.fromEntries(MISSIONS.map((m) => [m.id, m]));

  /* All canon chapters 1-4 are playable. Nothing planned remains. */
  const PLANNED_MISSIONS = [];

  /* ---------- fictional demo profiles for the leaderboard ---------- */
  const DEMO_PLAYERS = [
    { id: 'd1', name: 'Dutch Halloran', portrait: 3, xp: 5200, respect: 5120, networthMinor: D(18450) },
    { id: 'd2', name: 'Mae Delacroix', portrait: 2, xp: 3400, respect: 3380, networthMinor: D(12180) },
    { id: 'd3', name: 'Sal "Two-Ton" Ferrante', portrait: 5, xp: 2100, respect: 2140, networthMinor: D(6420) },
    { id: 'd4', name: 'Ray Calloway', portrait: 4, xp: 1250, respect: 1560, networthMinor: D(4175) },
    { id: 'd5', name: 'Eddie Brandt', portrait: 0, xp: 700, respect: 640, networthMinor: D(980) },
    { id: 'd6', name: 'Gino Alessi', portrait: 0, xp: 320, respect: 310, networthMinor: D(635) },
    { id: 'd7', name: 'Nate Kowalski', portrait: 4, xp: 110, respect: 58, networthMinor: D(170) },
    { id: 'd8', name: 'Lou Pescatore', portrait: 5, xp: 5, respect: 4, networthMinor: D(38) },
  ];

  /* ---------- achievements ---------- */
  const ACHIEVEMENTS = [
    { id: 'arrival', title: 'Fresh Off the Train', desc: 'Arrive in Chicago with one hundred dollars and big ideas.', check: () => true },
    { id: 'first-job', title: 'First Job', desc: 'Resolve your first job.', check: (s) => s.stats.attempts >= 1 },
    { id: 'first-win', title: 'Earned Your Keep', desc: 'Succeed at a job.', check: (s) => s.stats.successes >= 1 },
    { id: 'streak', title: 'Hot Streak', desc: 'Succeed three jobs in a row.', check: (s) => s.stats.bestStreak >= 3 },
    { id: 'shopper', title: 'Well Supplied', desc: 'Buy your first item from the shop.', check: (s) => s.stats.purchases >= 1 },
    { id: 'armed', title: 'Armed and Ready', desc: 'Equip a weapon.', check: (s) => !!s.equipped.weapon },
    { id: 'runner', title: 'Made a Name', desc: 'Reach the rank of Runner.', check: (s) => playerRankIdx(s) >= 1 },
    { id: 'grand', title: 'Money in the Pocket', desc: 'Hold $500 in cash.', check: (s) => s.player.cashMinor >= D(500) },
    { id: 'wanderer', title: 'Knows the Streets', desc: 'Visit three districts.', check: (s) => s.visited.length >= 3 },
  ];
  const ACH_BY_ID = Object.fromEntries(ACHIEVEMENTS.map((a) => [a.id, a]));

  /* ---------- state ---------- */
  function createInitialState(now) {
    now = now || Date.now();
    const s = {
      version: SAVE_VERSION,
      player: {
        name: 'Tommy Malone', portrait: 1, xp: 0, cashMinor: CONFIG.startCashMinor,
        health: CONFIG.maxHealth, energy: CONFIG.maxEnergy, heat: 0, respect: 0, attrPoints: 0,
        attrs: { strength: 5, agility: 5, accuracy: 5, intelligence: 5, charisma: 5 }, district: 'south-side',
      },
      inventory: { 'wool-suit': 1, 'flat-cap': 1 },
      equipped: { weapon: null, head: 'flat-cap', outfit: 'wool-suit', outerwear: null, accessory: null },
      missions: {},
      combat: null,
      condition: {},
      businesses: {},
      daily: { lastAt: 0, streak: 0 },
      idem: {},
      flags: {},
      claimed: [],
      ledger: [],
      stats: { attempts: 0, successes: 0, failures: 0, streak: 0, bestStreak: 0, purchases: 0 },
      visited: ['south-side'],
      achievements: { arrival: now },
      activity: [],
      stamps: { health: now, energy: now, heat: now },
    };
    s.activity.push({ id: 'a3', ts: now - 2000, kind: 'demo', text: 'A new job has appeared on the board.' });
    s.activity.push({ id: 'a2', ts: now - 1000, kind: 'demo', text: 'You met Frankie Russo.' });
    s.activity.push({ id: 'a1', ts: now, kind: 'demo', text: 'You arrived in Chicago.' });
    s.activity.sort((a, b) => b.ts - a.ts);
    return s;
  }

  let seq = 0;
  function pushActivity(s, text, kind, now) {
    seq += 1;
    s.activity.unshift({ id: 'e' + now + '-' + seq, ts: now, kind: kind || 'event', text });
    if (s.activity.length > CONFIG.activityMax) s.activity.length = CONFIG.activityMax;
  }
  function pushLedger(s, type, amountMinor, ref, now) {
    seq += 1;
    s.ledger.unshift({ id: 't' + now + '-' + seq, ts: now, type, amountMinor, ref: String(ref).slice(0, 60) });
    if (s.ledger.length > CONFIG.ledgerMax) s.ledger.length = CONFIG.ledgerMax;
  }

  function effective(s) {
    const out = { maxHealth: CONFIG.maxHealth, maxEnergy: CONFIG.maxEnergy };
    for (const k of ATTRS) out[k] = s.player.attrs[k];
    const bonus = { health: 0 };
    for (const k of ATTRS) bonus[k] = 0;
    for (const slot of SLOTS) {
      const it = ITEM_BY_ID[s.equipped[slot]];
      if (!it) continue;
      for (const k of ATTRS) bonus[k] += it.bonuses[k] || 0;
      bonus.health += it.bonuses.health || 0;
    }
    for (const k of ATTRS) out[k] += bonus[k];
    out.maxHealth += bonus.health;
    out.bonus = bonus;
    return out;
  }
  const maxHealth = (s) => effective(s).maxHealth;

  function netWorthMinor(s) {
    let total = s.player.cashMinor;
    for (const id of Object.keys(s.inventory)) { const it = ITEM_BY_ID[id]; if (it) total += it.priceMinor * s.inventory[id]; }
    for (const id of Object.keys(s.businesses || {})) { const b = BUSINESS_BY_ID[id]; if (b) total += b.priceMinor; }
    return total;
  }

  function slotsUsed(inv) {
    let n = 0;
    for (const id of Object.keys(inv)) {
      const it = ITEM_BY_ID[id];
      if (!it || !(inv[id] > 0)) continue;
      n += it.stackable ? Math.ceil(inv[id] / CONFIG.maxStack) : 1;
    }
    return n;
  }

  function normalize(s) {
    s.player.cashMinor = Math.max(0, Math.round(s.player.cashMinor));
    s.player.xp = Math.max(0, Math.round(s.player.xp));
    s.player.respect = Math.max(0, Math.round(s.player.respect));
    s.player.heat = clamp(Math.round(s.player.heat), 0, CONFIG.maxHeat);
    s.player.energy = clamp(Math.round(s.player.energy), 0, CONFIG.maxEnergy);
    s.player.health = clamp(Math.round(s.player.health), 0, maxHealth(s));
    return s;
  }

  function checkAchievements(s, now) {
    const gained = [];
    for (const a of ACHIEVEMENTS) {
      if (!s.achievements[a.id] && a.check(s)) {
        s.achievements[a.id] = now; gained.push(a);
        pushActivity(s, 'Achievement unlocked: ' + a.title + '.', 'achievement', now);
      }
    }
    return gained;
  }

  /* ---------- missions: Locked > Available > Active > Resolved > Claimed ---------- */
  const missionLog = (s, id) => s.missions[id] || null;
  function activeMissionId(s) {
    for (const id of Object.keys(s.missions)) { const l = s.missions[id]; if (l && (l.active || l.pending)) return id; }
    return null;
  }

  function missionStatus(s, m, now) {
    now = now || Date.now();
    const log = missionLog(s, m.id);
    if (log && log.pending) return { state: 'resolved', remainingMs: 0 };
    if (log && log.active) return { state: 'active', remainingMs: 0 };
    if (playerRankIdx(s) < RANK_IDX[m.rankReq]) return { state: 'locked', reason: 'Reach the rank of ' + rankName(m.rankReq), remainingMs: 0 };
    for (const p of m.prereq) {
      const pl = missionLog(s, p);
      if (!pl || !pl.claimedCount) return { state: 'locked', reason: 'Finish "' + MISSION_BY_ID[p].title + '" first', remainingMs: 0 };
    }
    if (!m.repeatable && log && log.claimedCount) return { state: 'claimed', remainingMs: 0 };
    if (log && log.cooldownUntil > now) return { state: 'cooldown', remainingMs: log.cooldownUntil - now };
    return { state: 'available', remainingMs: 0 };
  }

  function computeChance(s, m, c) {
    const attr = effective(s)[c.attr];
    let ch = c.chance + (attr - 5) * 0.025 + (playerRankIdx(s) - RANK_IDX[m.rankReq]) * 0.01;
    if (s.player.district === m.district) ch += 0.05;
    if (c.boost && s.flags[c.boost.flag]) ch += c.boost.amount;
    for (const [minHeat, pen] of CONFIG.heatOddsPenalty) if (s.player.heat >= minHeat) { ch -= pen; break; }
    return clamp(ch, 0.1, 0.92);
  }

  function startMission(state, missionId, now) {
    now = now || Date.now();
    const m = MISSION_BY_ID[missionId];
    if (!m) return { ok: false, error: 'That job is no longer on the board.' };
    const st = missionStatus(state, m, now);
    if (st.state === 'locked') return { ok: false, error: st.reason + '.' };
    if (st.state === 'claimed') return { ok: false, error: 'You already finished this job.' };
    if (st.state === 'cooldown') return { ok: false, error: 'You are lying low. This job opens again in ' + fmtClock(st.remainingMs) + '.' };
    if (st.state === 'active' || st.state === 'resolved') return { ok: false, error: 'You already started this job.' };
    const other = activeMissionId(state);
    if (other) return { ok: false, error: 'Finish "' + MISSION_BY_ID[other].title + '" before starting another job.' };
    if (state.player.health < CONFIG.minHealthToWork) return { ok: false, error: 'You are too hurt to work. Patch yourself up first.' };
    if (state.player.energy < m.energy) return { ok: false, error: 'You need ' + m.energy + ' energy for this job and have ' + state.player.energy + '. Rest, or eat something.' };
    const s = clone(state);
    s.player.energy -= m.energy;
    const log = s.missions[m.id] || { attempts: 0, claimedCount: 0, successes: 0, cooldownUntil: 0, last: null };
    log.attempts += 1;
    log.active = { attemptId: m.id + '#' + log.attempts, startedAt: now };
    log.pending = null;
    s.missions[m.id] = log;
    pushActivity(s, 'Started "' + m.title + '" (−' + m.energy + ' energy).', 'event', now);
    normalize(s);
    return { ok: true, state: s, message: 'You took the job. −' + m.energy + ' energy.' };
  }

  /* Rolls the outcome and stores it as a pending result. Nothing is paid until the player claims it. */
  function resolveMission(state, missionId, choiceId, rng, now) {
    rng = rng || Math.random; now = now || Date.now();
    const m = MISSION_BY_ID[missionId];
    if (!m) return { ok: false, error: 'That job is no longer on the board.' };
    const c = m.choices.find((x) => x.id === choiceId);
    if (!c) return { ok: false, error: 'Pick one of the three approaches.' };
    const log = missionLog(state, m.id);
    if (!log || !log.active) return { ok: false, error: 'Start the job before you pick an approach.' };
    const s = clone(state);
    const chance = computeChance(s, m, c);
    const roll = rng();
    const outcome = roll < chance ? 'success' : roll < chance + (c.partial || 0) ? 'partial' : 'failure';
    let cashMinor = 0, xp = 0, respect = 0, healthLost = 0, cashLostMinor = 0, heat = 0, flags = [];
    const baseDollars = Math.round(randInt(rng, m.cash) * c.mult);
    if (outcome === 'success') { cashMinor = D(baseDollars); xp = m.xp; respect = m.respect; heat = c.heat[0]; flags = m.flags.slice(); }
    else if (outcome === 'partial') { cashMinor = D(Math.round(baseDollars * 0.5)); xp = Math.round(m.xp * 0.6); respect = Math.round(m.respect * 0.5); heat = Math.round((c.heat[0] + c.heat[1]) / 2); flags = m.flags.slice(); }
    else {
      xp = Math.round(m.xp * 0.2); heat = c.heat[1];
      healthLost = randInt(rng, c.fail.health || [0, 0]);
      cashLostMinor = Math.min(s.player.cashMinor, D(randInt(rng, c.fail.cash || [0, 0])));
    }
    const l = s.missions[m.id];
    l.pending = { attemptId: l.active.attemptId, choiceId: c.id, outcome, chance, text: c.text[outcome], cashMinor, cashLostMinor, xp, respect, heat, healthLost, flags };
    l.active = null;
    pushActivity(s, 'Finished the work on "' + m.title + '" (' + c.label + '). Claim your reward.', 'event', now);
    return { ok: true, state: s, result: clone(l.pending) };
  }

  /* Applies rewards exactly once per attempt (Bible section 8). */
  function claimMission(state, missionId, now) {
    now = now || Date.now();
    const m = MISSION_BY_ID[missionId];
    if (!m) return { ok: false, error: 'That job is no longer on the board.' };
    const log = missionLog(state, m.id);
    if (!log || !log.pending) return { ok: false, error: 'There is nothing to claim for this job.' };
    const p = log.pending;
    if (state.claimed.includes(p.attemptId)) return { ok: false, error: 'This reward was already claimed.' };
    const s = clone(state);
    const l = s.missions[m.id];
    const rankBefore = playerRankIdx(s);
    const districtsBefore = DISTRICTS.filter((d) => rankBefore >= RANK_IDX[d.rankReq]).map((d) => d.id);
    const missionsBefore = MISSIONS.filter((x) => missionStatus(s, x, now).state === 'available').map((x) => x.id);

    s.player.cashMinor += p.cashMinor - p.cashLostMinor;
    if (p.cashMinor) pushLedger(s, 'reward', p.cashMinor, m.title, now);
    if (p.cashLostMinor) pushLedger(s, 'loss', -p.cashLostMinor, m.title, now);
    s.player.xp += p.xp;
    s.player.respect += p.respect;
    s.player.heat = clamp(s.player.heat + p.heat, 0, CONFIG.maxHeat);
    let knockedOut = false;
    if (p.healthLost) {
      const left = s.player.health - p.healthLost;
      if (left <= 0) { s.player.health = CONFIG.defeatRecoveryHealth; knockedOut = true; } else s.player.health = left;
    }
    for (const f of p.flags) if (!s.flags[f]) s.flags[f] = now;

    l.claimedCount = (l.claimedCount || 0) + 1;
    if (p.outcome !== 'failure') l.successes = (l.successes || 0) + 1;
    l.last = p.outcome; l.lastAt = now;
    l.cooldownUntil = m.repeatable ? now + m.cooldownSec * 1000 : 0;
    l.pending = null; l.active = null;
    s.claimed.push(p.attemptId);
    if (s.claimed.length > 500) s.claimed = s.claimed.slice(-500);

    s.stats.attempts += 1;
    if (p.outcome === 'failure') { s.stats.failures += 1; s.stats.streak = 0; }
    else { s.stats.successes += 1; s.stats.streak += 1; s.stats.bestStreak = Math.max(s.stats.bestStreak, s.stats.streak); }

    const verb = p.outcome === 'success' ? 'Completed' : p.outcome === 'partial' ? 'Partly finished' : 'Failed';
    let line = verb + ' "' + m.title + '".';
    if (p.cashMinor) line += ' +' + fmtMoney(p.cashMinor) + '.';
    if (p.cashLostMinor) line += ' Lost ' + fmtMoney(p.cashLostMinor) + '.';
    if (p.healthLost) line += ' Took ' + p.healthLost + ' damage.';
    pushActivity(s, line, p.outcome, now);
    if (knockedOut) pushActivity(s, 'You were knocked out and came to in an alley with your health restored to ' + CONFIG.defeatRecoveryHealth + '.', 'failure', now);

    const rankAfter = playerRankIdx(s);
    const promotions = [];
    let attrPointsGained = 0;
    for (let i = rankBefore + 1; i <= rankAfter; i++) {
      promotions.push({ rank: RANKS[i].name, xp: RANKS[i].xp });
      pushActivity(s, 'You were promoted to ' + RANKS[i].name + '.', 'promotion', now);
      if (CONFIG.attrPointRanks.includes(RANKS[i].id)) { s.player.attrPoints += 1; attrPointsGained += 1; }
    }
    if (attrPointsGained) pushActivity(s, 'You earned ' + attrPointsGained + ' attribute point' + (attrPointsGained > 1 ? 's' : '') + ' to spend.', 'promotion', now);
    const districts = DISTRICTS.filter((d) => rankAfter >= RANK_IDX[d.rankReq] && !districtsBefore.includes(d.id)).map((d) => d.name);
    const unlocked = MISSIONS.filter((x) => missionStatus(s, x, now).state === 'available' && !missionsBefore.includes(x.id) && x.id !== m.id).map((x) => x.title);
    const achievements = checkAchievements(s, now);
    normalize(s);
    return { ok: true, state: s, result: { ...clone(p), missionId: m.id, knockedOut, promotions, attrPointsGained, districts, unlocked, achievements } };
  }

  /* ---------- economy and inventory ---------- */
  function buyItem(state, itemId, now) {
    now = now || Date.now();
    const it = ITEM_BY_ID[itemId];
    if (!it || !it.shop) return { ok: false, error: 'The dealer does not stock that.' };
    if (playerRankIdx(state) < RANK_IDX[it.rankReq]) return { ok: false, error: 'The dealer will not sell you the ' + it.name + ' until you reach the rank of ' + rankName(it.rankReq) + '.' };
    if (!it.stackable && (state.inventory[it.id] || 0) >= 1) return { ok: false, error: 'You already own the ' + it.name + '.' };
    if (it.stackable && (state.inventory[it.id] || 0) >= CONFIG.maxStack) return { ok: false, error: 'You cannot carry more than ' + CONFIG.maxStack + ' of those.' };
    if (state.player.cashMinor < it.priceMinor) return { ok: false, error: 'You are ' + fmtMoney(it.priceMinor - state.player.cashMinor) + ' short for the ' + it.name + '.' };
    const probe = { ...state.inventory, [it.id]: (state.inventory[it.id] || 0) + 1 };
    if (slotsUsed(probe) > CONFIG.inventorySlots) return { ok: false, error: 'Your inventory is full (' + CONFIG.inventorySlots + ' slots). Make room first.' };
    const s = clone(state);
    s.player.cashMinor -= it.priceMinor;
    s.inventory[it.id] = (s.inventory[it.id] || 0) + 1;
    if (it.combat) s.condition[it.id] = 100;
    s.stats.purchases += 1;
    pushLedger(s, 'purchase', -it.priceMinor, it.name, now);
    pushActivity(s, 'Bought ' + it.name + ' for ' + fmtMoney(it.priceMinor) + '.', 'shop', now);
    const achievements = checkAchievements(s, now);
    normalize(s);
    return { ok: true, state: s, message: it.name + ' added to your inventory.', achievements };
  }

  function equipItem(state, itemId, now) {
    now = now || Date.now();
    const it = ITEM_BY_ID[itemId];
    if (!it) return { ok: false, error: 'Unknown item.' };
    if (!it.slot) return { ok: false, error: 'The ' + it.name + ' cannot be equipped.' };
    if (!state.inventory[it.id]) return { ok: false, error: 'You do not own the ' + it.name + '.' };
    if (playerRankIdx(state) < RANK_IDX[it.rankReq]) return { ok: false, error: 'You need the rank of ' + rankName(it.rankReq) + ' to use the ' + it.name + '.' };
    if (state.equipped[it.slot] === it.id) return { ok: false, error: 'Already equipped.' };
    const s = clone(state);
    s.equipped[it.slot] = it.id;
    pushActivity(s, 'Equipped ' + it.name + '.', 'equip', now);
    const achievements = checkAchievements(s, now);
    normalize(s);
    return { ok: true, state: s, message: it.name + ' equipped.', achievements };
  }

  function unequipSlot(state, slot, now) {
    now = now || Date.now();
    if (!SLOTS.includes(slot) || !state.equipped[slot]) return { ok: false, error: 'Nothing is equipped there.' };
    const s = clone(state);
    const it = ITEM_BY_ID[s.equipped[slot]];
    s.equipped[slot] = null;
    pushActivity(s, 'Put away ' + it.name + '.', 'equip', now);
    normalize(s);
    return { ok: true, state: s, message: it.name + ' unequipped.' };
  }

  function useItem(state, itemId, now) {
    now = now || Date.now();
    const it = ITEM_BY_ID[itemId];
    if (!it || it.kind !== 'consumable') return { ok: false, error: 'That cannot be used.' };
    if (!(state.inventory[it.id] > 0)) return { ok: false, error: 'You do not have any ' + it.name + '.' };
    const eff = it.effect || {};
    if (eff.health && state.player.health >= maxHealth(state)) return { ok: false, error: 'You are already in fighting shape.' };
    if (eff.energy && state.player.energy >= CONFIG.maxEnergy) return { ok: false, error: 'You are not tired.' };
    const s = clone(state);
    if (eff.health) s.player.health = Math.min(maxHealth(s), s.player.health + eff.health);
    if (eff.energy) s.player.energy = Math.min(CONFIG.maxEnergy, s.player.energy + eff.energy);
    s.inventory[it.id] -= 1;
    if (s.inventory[it.id] <= 0) delete s.inventory[it.id];
    pushActivity(s, 'Used ' + it.name + '.', 'equip', now);
    normalize(s);
    return { ok: true, state: s, message: 'Used ' + it.name + (eff.health ? '. +' + eff.health + ' health' : eff.energy ? '. +' + eff.energy + ' energy' : '') + '.' };
  }

  function patchUp(state, now) {
    now = now || Date.now();
    const max = maxHealth(state);
    if (state.player.health >= max) return { ok: false, error: 'You are already in fighting shape.' };
    if (state.player.cashMinor < CONFIG.patchUpCostMinor) return { ok: false, error: 'The doc wants ' + fmtMoney(CONFIG.patchUpCostMinor) + ' up front and you are short.' };
    const s = clone(state);
    s.player.cashMinor -= CONFIG.patchUpCostMinor;
    s.player.health = max;
    s.stamps.health = now;
    pushLedger(s, 'service', -CONFIG.patchUpCostMinor, 'Back-alley doctor', now);
    pushActivity(s, 'Paid a back-alley doctor ' + fmtMoney(CONFIG.patchUpCostMinor) + ' to patch you up.', 'shop', now);
    normalize(s);
    return { ok: true, state: s, message: 'Patched up. Back to full health.' };
  }

  /* Attribute growth: one point per milestone promotion, spent on any single attribute (soft cap 20 on base value). */
  const earnedAttrPoints = (xp) => CONFIG.attrPointRanks.filter((id) => rankIndexForXp(xp) >= RANK_IDX[id]).length;
  function spendAttributePoint(state, attr, now) {
    now = now || Date.now();
    if (!ATTRS.includes(attr)) return { ok: false, error: 'Unknown attribute.' };
    if (!(state.player.attrPoints > 0)) return { ok: false, error: 'You have no attribute points to spend.' };
    if (state.player.attrs[attr] >= CONFIG.attrSoftCap) return { ok: false, error: ATTR_LABEL[attr] + ' is already at the cap of ' + CONFIG.attrSoftCap + '.' };
    const s = clone(state);
    s.player.attrs[attr] += 1; s.player.attrPoints -= 1;
    pushActivity(s, 'Raised ' + ATTR_LABEL[attr] + ' to ' + s.player.attrs[attr] + '.', 'promotion', now);
    return { ok: true, state: s, message: ATTR_LABEL[attr] + ' is now ' + s.player.attrs[attr] + '.' };
  }

  function changeDistrict(state, districtId, now) {
    now = now || Date.now();
    const d = DISTRICT_BY_ID[districtId];
    if (!d) return { ok: false, error: 'Unknown district.' };
    if (playerRankIdx(state) < RANK_IDX[d.rankReq]) return { ok: false, error: d.name + ' opens at the rank of ' + rankName(d.rankReq) + '.' };
    if (state.player.district === d.id) return { ok: false, error: 'You are already in ' + d.name + '.' };
    const s = clone(state);
    s.player.district = d.id;
    if (!s.visited.includes(d.id)) s.visited.push(d.id);
    pushActivity(s, 'You made your way to ' + d.name + '.', 'travel', now);
    const achievements = checkAchievements(s, now);
    return { ok: true, state: s, message: 'Welcome to ' + d.name + '.', achievements };
  }

  function validateName(raw) {
    const v = String(raw == null ? '' : raw).trim().replace(/\s+/g, ' ');
    if (!v) return { ok: false, error: 'Enter a name. The street needs something to call you.' };
    if (v.length < 3) return { ok: false, error: 'Use at least 3 characters.' };
    if (v.length > 20) return { ok: false, error: 'Keep it to 20 characters or fewer.' };
    if (!/^[A-Za-z0-9][A-Za-z0-9 '.\-]*$/.test(v)) return { ok: false, error: 'Use letters, numbers, spaces, apostrophes, periods or hyphens.' };
    return { ok: true, value: v };
  }

  function updateProfile(state, name, portrait, now) {
    now = now || Date.now();
    const v = validateName(name);
    if (!v.ok) return v;
    const p = Number(portrait);
    if (!Number.isInteger(p) || p < 0 || p > 5) return { ok: false, error: 'Pick one of the six portraits.' };
    const s = clone(state);
    const changed = s.player.name !== v.value;
    s.player.name = v.value; s.player.portrait = p;
    if (changed) pushActivity(s, 'You are now known as ' + v.value + '.', 'event', now);
    return { ok: true, state: s, message: 'Profile saved.' };
  }

  /* Natural recovery: health and energy come back, heat cools. Each stamp advances by whole ticks. */
  function regen(state, now) {
    now = now || Date.now();
    const max = maxHealth(state);
    const plan = [
      ['health', CONFIG.healthRegenMs, 1, state.player.health < max && !state.combat, (p, n) => { p.health = Math.min(max, p.health + n); }, (p) => p.health >= max],
      ['energy', CONFIG.energyRegenMs, 1, state.player.energy < CONFIG.maxEnergy, (p, n) => { p.energy = Math.min(CONFIG.maxEnergy, p.energy + n); }, (p) => p.energy >= CONFIG.maxEnergy],
      ['heat', CONFIG.heatDecayMs, 1, state.player.heat > 0, (p, n) => { p.heat = Math.max(0, p.heat - n); }, (p) => p.heat <= 0],
    ];
    let s = null;
    for (const [key, every, step, needs, apply, done] of plan) {
      const stamp = state.stamps[key];
      if (!needs) { if (stamp !== now) { s = s || clone(state); s.stamps[key] = now; } continue; }
      const ticks = Math.floor((now - stamp) / every);
      if (ticks < 1) continue;
      s = s || clone(state);
      apply(s.player, ticks * step);
      s.stamps[key] = done(s.player) ? now : stamp + ticks * every;
    }
    return s || state;
  }

  /* ---------- combat: text-driven, turn-based (Bible section 9) ----------
     Bible proposals used as-is: base accuracy 70%, ceiling 90%, floor 20%, damage 5-15, defense reduction 30%,
     negotiation uses Charisma, escape uses Agility, defeat recovery restores health to 50.
     Everything else here (enemy stats, rewards, per-attribute scaling) is a PROVISIONAL game value, not a real-world claim. */
  /* ---------- businesses (Bible section 13) ----------
     Prices, gross income and expenses per day are the Bible's proposed fictional game values. Acquisition at Associate rank is the Bible's suggestion.
     Level names are canon; level upgrades are a later feature, so every business stays at level 1 for now.
     Income accrues on the clock, uncollected income is capped at 24 hours, and settlement happens once per collection. */
  const BUSINESS_LEVELS = ['Newly Acquired', 'Established', 'Respected', 'Prominent', 'Prestigious'];
  const BUSINESSES = [
    { id: 'neighborhood-restaurant', name: 'Neighborhood Restaurant', glyph: 'heart', district: 'south-side', rankReq: 'associate', priceMinor: D(1000), grossMinorPerDay: D(100), expenseMinorPerDay: D(35),
      description: 'Eight tables, a good stove and a cook who keeps the regulars loyal. Fictional.' },
    { id: 'jazz-club', name: 'Jazz Club', glyph: 'star', district: 'near-north', rankReq: 'associate', priceMinor: D(2500), grossMinorPerDay: D(240), expenseMinorPerDay: D(100),
      description: 'A basement room with a small stage, a four-piece band and a back door for friends. Fictional.' },
    { id: 'warehouse', name: 'Warehouse', glyph: 'lock', district: 'riverfront', rankReq: 'associate', priceMinor: D(3000), grossMinorPerDay: D(280), expenseMinorPerDay: D(120),
      description: 'Brick walls, a loading dock and a night watchman who asks no questions. Fictional.' },
    { id: 'trading-office', name: 'Trading Office', glyph: 'book', district: 'the-loop', rankReq: 'associate', priceMinor: D(2000), grossMinorPerDay: D(190), expenseMinorPerDay: D(65),
      description: 'Two desks, a ticker and a window onto La Salle Street. Fictional.' },
  ];
  const BUSINESS_BY_ID = Object.fromEntries(BUSINESSES.map((b) => [b.id, b]));
  const DAY_MS = 24 * 3600 * 1000;

  /* what has built up since the last collection, capped at 24 hours */
  function businessAccrual(s, id, now) {
    now = now || Date.now();
    const b = BUSINESS_BY_ID[id], own = s.businesses && s.businesses[id];
    if (!b || !own) return { grossMinor: 0, expenseMinor: 0, netMinor: 0, elapsedMs: 0, capped: false };
    const raw = Math.max(0, now - own.lastCollectAt), elapsedMs = Math.min(raw, CONFIG.businessCapMs);
    const m = levelMult(own.level || 1);
    const grossMinor = Math.floor(b.grossMinorPerDay * m * elapsedMs / DAY_MS), expenseMinor = Math.floor(b.expenseMinorPerDay * m * elapsedMs / DAY_MS);
    return { grossMinor, expenseMinor, netMinor: grossMinor - expenseMinor, elapsedMs, capped: raw >= CONFIG.businessCapMs };
  }
  /* Level upgrades. PROVISIONAL: each level adds 25% to income and expenses, costs half the purchase price times the current level, and needs a minimum rank. */
  const BUSINESS_LEVEL_RANK = [null, 'associate', 'crew_hand', 'lieutenant', 'underboss'];
  const levelMult = (level) => 1 + 0.25 * (level - 1);
  const upgradeCostMinor = (b, level) => Math.round(b.priceMinor * 0.5 * level);
  const maxLevelForXp = (xp) => { const idx = rankIndexForXp(xp); let lv = 1; for (let l = 2; l <= 5; l++) if (idx >= RANK_IDX[BUSINESS_LEVEL_RANK[l - 1]]) lv = l; return lv; };
  function businessStatus(s, b) {
    if (s.businesses && s.businesses[b.id]) return { state: 'owned' };
    if (playerRankIdx(s) < RANK_IDX[b.rankReq]) return { state: 'locked', reason: 'Reach the rank of ' + rankName(b.rankReq) };
    return { state: 'for-sale' };
  }
  function buyBusiness(state, id, now) {
    now = now || Date.now();
    const b = BUSINESS_BY_ID[id];
    if (!b) return { ok: false, error: 'That business is not for sale.' };
    const st = businessStatus(state, b);
    if (st.state === 'owned') return { ok: false, error: 'You already own the ' + b.name + '.' };
    if (st.state === 'locked') return { ok: false, error: st.reason + '.' };
    if (state.player.cashMinor < b.priceMinor) return { ok: false, error: 'You are ' + fmtMoney(b.priceMinor - state.player.cashMinor) + ' short for the ' + b.name + '.' };
    const s = clone(state);
    s.player.cashMinor -= b.priceMinor;
    s.businesses[b.id] = { level: 1, boughtAt: now, lastCollectAt: now };
    pushLedger(s, 'purchase', -b.priceMinor, b.name, now);
    pushActivity(s, 'Bought the ' + b.name + ' for ' + fmtMoney(b.priceMinor) + '.', 'shop', now);
    const achievements = checkAchievements(s, now);
    normalize(s);
    return { ok: true, state: s, message: 'You now own the ' + b.name + '.', achievements };
  }
  /* Settles any waiting income first so a new level never changes what was already earned. */
  function upgradeBusiness(state, id, now) {
    now = now || Date.now();
    const b = BUSINESS_BY_ID[id], own = state.businesses && state.businesses[id];
    if (!b || !own) return { ok: false, error: 'You do not own that business.' };
    if (own.level >= 5) return { ok: false, error: 'The ' + b.name + ' is already Prestigious.' };
    const need = BUSINESS_LEVEL_RANK[own.level];
    if (playerRankIdx(state) < RANK_IDX[need]) return { ok: false, error: 'Reach the rank of ' + rankName(need) + ' to take the ' + b.name + ' to ' + BUSINESS_LEVELS[own.level] + '.' };
    const cost = upgradeCostMinor(b, own.level);
    let s = state, collected = null;
    const a = businessAccrual(state, id, now);
    if (state.player.cashMinor + a.netMinor < cost) return { ok: false, error: 'The upgrade costs ' + fmtMoney(cost) + ' and you are ' + fmtMoney(cost - state.player.cashMinor - a.netMinor) + ' short.' };
    if (a.grossMinor > 0) { const c = collectBusiness(state, id, now); if (!c.ok) return c; s = c.state; collected = c.collected; }
    s = clone(s);
    s.player.cashMinor -= cost;
    s.businesses[id].level += 1; s.businesses[id].lastCollectAt = now;
    pushLedger(s, 'upgrade', -cost, b.name, now);
    pushActivity(s, 'Upgraded the ' + b.name + ' to ' + BUSINESS_LEVELS[s.businesses[id].level - 1] + ' for ' + fmtMoney(cost) + '.', 'shop', now);
    normalize(s);
    return { ok: true, state: s, message: b.name + ' is now ' + BUSINESS_LEVELS[s.businesses[id].level - 1] + '.', collected };
  }
  /* Pays net income once: gross and expenses are written as two ledger lines, then the clock restarts. */
  function collectBusiness(state, id, now) {
    now = now || Date.now();
    const b = BUSINESS_BY_ID[id];
    if (!b || !(state.businesses && state.businesses[id])) return { ok: false, error: 'You do not own that business.' };
    const a = businessAccrual(state, id, now);
    if (a.grossMinor <= 0) return { ok: false, error: 'Nothing has built up at the ' + b.name + ' yet.' };
    const s = clone(state);
    s.player.cashMinor += a.netMinor;
    pushLedger(s, 'business income', a.grossMinor, b.name, now);
    if (a.expenseMinor) pushLedger(s, 'business expense', -a.expenseMinor, b.name, now);
    s.businesses[id].lastCollectAt = now;
    pushActivity(s, 'Collected ' + fmtMoney(a.netMinor) + ' from the ' + b.name + ' (income ' + fmtMoney(a.grossMinor) + ', expenses ' + fmtMoney(a.expenseMinor) + ').', 'success', now);
    normalize(s);
    return { ok: true, state: s, message: 'Collected ' + fmtMoney(a.netMinor) + ' from the ' + b.name + '.', collected: a };
  }

  /* ---------- weapon condition (Bible section 10) ----------
     Condition is an abstract 0-100 game score, kept per owned weapon, separate from the catalog definition.
     The per-weapon combat modifiers and the band multipliers are PROVISIONAL balance values. */
  const CONDITION_BANDS = [[90, 'Excellent', 1], [70, 'Good', 0.9], [40, 'Worn', 0.7], [1, 'Damaged', 0.4], [0, 'Unusable', 0]];
  const conditionBand = (n) => { const b = CONDITION_BANDS.find((x) => n >= x[0]); return { name: b[1], mult: b[2] }; };
  const conditionOf = (s, id) => (Number.isFinite(s.condition && s.condition[id]) ? s.condition[id] : 100);
  function weaponCombat(s) {
    const it = ITEM_BY_ID[s.equipped.weapon];
    if (!it || !it.combat) return null;
    const cond = conditionOf(s, it.id), band = conditionBand(cond);
    return { item: it, cond, band: band.name, mult: band.mult, acc: it.combat.acc * band.mult, dmg: Math.round(it.combat.dmg * band.mult), usable: cond > 0 };
  }
  const repairCostMinor = (s, id) => Math.max(0, 100 - conditionOf(s, id)) * CONFIG.repairPerPointMinor;
  function repairWeapon(state, itemId, now) {
    now = now || Date.now();
    const it = ITEM_BY_ID[itemId];
    if (!it || !it.combat || !(state.inventory[it.id] > 0)) return { ok: false, error: 'You do not own a weapon like that.' };
    if (state.combat) return { ok: false, error: 'Not in the middle of a fight.' };
    const cost = repairCostMinor(state, it.id);
    if (cost <= 0) return { ok: false, error: 'The ' + it.name + ' is already in perfect shape.' };
    if (state.player.cashMinor < cost) return { ok: false, error: 'The gunsmith wants ' + fmtMoney(cost) + ' and you are short.' };
    const s = clone(state);
    s.player.cashMinor -= cost; s.condition[it.id] = 100;
    pushLedger(s, 'service', -cost, 'Gunsmith: ' + it.name, now);
    pushActivity(s, 'Paid a gunsmith ' + fmtMoney(cost) + ' to restore your ' + it.name + '.', 'shop', now);
    normalize(s);
    return { ok: true, state: s, message: it.name + ' restored to excellent condition.' };
  }

  const COMBAT = { baseAcc: 0.7, accMin: 0.2, accMax: 0.9, dmg: [5, 15], defenseCut: 0.3, accPerPoint: 0.02, dmgPerStrength: 0.5, chaPerPoint: 0.03, agiPerPoint: 0.03, logMax: 8 };
  const ENCOUNTERS = [
    { id: 'alley-shakedown', title: 'Alley Shakedown', district: 'west-side', rankReq: 'newcomer', energy: 10, glyph: 'str',
      enemy: { name: 'Alley Tough', hp: 30, acc: 0.6, dmg: [4, 9] }, negotiate: 0.5, escape: 0.6, cash: [10, 20], xp: 25, respect: 3, heat: 3, lossCash: 5,
      summary: 'A hungry tough is working the alley behind the café and wants your pocket money.',
      intro: 'He steps out from behind the ash cans with a length of pipe and a bad idea.' },
    { id: 'dockside-brawl', title: 'Dockside Brawl', district: 'riverfront', rankReq: 'associate', energy: 15, glyph: 'anchor',
      enemy: { name: 'Dockside Brawler', hp: 50, acc: 0.65, dmg: [6, 12] }, negotiate: 0.4, escape: 0.5, cash: [25, 40], xp: 45, respect: 5, heat: 4, lossCash: 8,
      summary: 'A rival crew is shaking down the dockhands and one of them is looking for a fight.',
      intro: 'He rolls his sleeves past the elbow and the rest of the dock suddenly finds something else to look at.' },
    { id: 'rival-gunman', title: 'The Rival\'s Gunman', district: 'the-loop', rankReq: 'trusted_associate', energy: 20, glyph: 'target',
      enemy: { name: 'Rival Gunman', hp: 70, acc: 0.7, dmg: [8, 15] }, negotiate: 0.25, escape: 0.45, cash: [40, 65], xp: 70, respect: 8, heat: 6, lossCash: 12,
      summary: 'A hired gun from another outfit has been told your name and your usual route.',
      intro: 'He is waiting under the Loop tracks with his hat low and one hand inside his coat.' },
  ];
  const ENCOUNTER_BY_ID = Object.fromEntries(ENCOUNTERS.map((e) => [e.id, e]));

  function encounterStatus(s, enc) {
    if (playerRankIdx(s) < RANK_IDX[enc.rankReq]) return { state: 'locked', reason: 'Reach the rank of ' + rankName(enc.rankReq) };
    return { state: 'available' };
  }
  const hitChance = (base, delta) => clamp(base + delta, COMBAT.accMin, COMBAT.accMax);

  function startEncounter(state, encId, now) {
    now = now || Date.now();
    const enc = ENCOUNTER_BY_ID[encId];
    if (!enc) return { ok: false, error: 'There is no trouble like that on the street.' };
    if (state.combat) return { ok: false, error: 'You are already in a fight.' };
    const st = encounterStatus(state, enc);
    if (st.state === 'locked') return { ok: false, error: st.reason + '.' };
    if (state.player.health < CONFIG.minHealthToWork) return { ok: false, error: 'You are too hurt to fight. Patch yourself up first.' };
    if (state.player.energy < enc.energy) return { ok: false, error: 'You need ' + enc.energy + ' energy to pick this fight and have ' + state.player.energy + '. Rest, or eat something.' };
    const s = clone(state);
    s.player.energy -= enc.energy;
    s.combat = { encId: enc.id, round: 1, enemyHp: enc.enemy.hp, enemyMax: enc.enemy.hp, log: [enc.intro] };
    pushActivity(s, 'Picked a fight: "' + enc.title + '" (−' + enc.energy + ' energy).', 'event', now);
    normalize(s);
    return { ok: true, state: s, message: 'Fight started. −' + enc.energy + ' energy.' };
  }

  /* Displayed odds for the fight screen. The same formulas combatAction uses. */
  function combatOdds(s) {
    const cb = s.combat, enc = cb && ENCOUNTER_BY_ID[cb.encId];
    if (!enc) return null;
    const e = effective(s);
    return {
      attack: hitChance(COMBAT.baseAcc, (e.accuracy - 5) * COMBAT.accPerPoint + (weaponCombat(s) ? weaponCombat(s).acc : 0)),
      negotiate: clamp(enc.negotiate + (e.charisma - 5) * COMBAT.chaPerPoint, 0.15, COMBAT.accMax),
      escape: clamp(enc.escape + (e.agility - 5) * COMBAT.agiPerPoint, 0.2, COMBAT.accMax),
      enemyHit: hitChance(enc.enemy.acc, -(e.agility - 5) * COMBAT.accPerPoint),
    };
  }

  /* One round: the player acts, then the enemy answers unless the fight just ended. Rewards are applied once, when the fight ends. */
  function combatAction(state, action, rng, now, itemId) {
    rng = rng || Math.random; now = now || Date.now();
    const cb = state.combat;
    if (!cb) return { ok: false, error: 'You are not in a fight.' };
    const enc = ENCOUNTER_BY_ID[cb.encId];
    if (!enc) return { ok: false, error: 'This fight is no longer valid.' };
    if (!['attack', 'defend', 'negotiate', 'escape', 'item'].includes(action)) return { ok: false, error: 'Pick attack, defend, negotiate, escape or use an item.' };
    const s = clone(state);
    const e = effective(s), c = s.combat, log = [];
    let end = null, defending = false;
    if (action === 'item') {
      const it = ITEM_BY_ID[itemId];
      if (!it || it.kind !== 'consumable' || !it.effect || !it.effect.health) return { ok: false, error: 'Only something that heals can be used in a fight.' };
      if (!(s.inventory[it.id] > 0)) return { ok: false, error: 'You do not have any ' + it.name + '.' };
      if (s.player.health >= e.maxHealth) return { ok: false, error: 'You are already in fighting shape.' };
      s.player.health = Math.min(e.maxHealth, s.player.health + it.effect.health);
      s.inventory[it.id] -= 1; if (s.inventory[it.id] <= 0) delete s.inventory[it.id];
      log.push('You use a ' + it.name + ' and get back on your feet.');
    } else if (action === 'attack') {
      const w = weaponCombat(s);
      const acc = hitChance(COMBAT.baseAcc, (e.accuracy - 5) * COMBAT.accPerPoint + (w ? w.acc : 0));
      if (rng() < acc) {
        const dmg = randInt(rng, COMBAT.dmg) + Math.max(0, Math.round((e.strength - 5) * COMBAT.dmgPerStrength)) + (w ? w.dmg : 0);
        c.enemyHp = Math.max(0, c.enemyHp - dmg);
        log.push('You hit the ' + enc.enemy.name + ' for ' + dmg + '.');
        if (c.enemyHp <= 0) end = 'won';
      } else log.push(w && w.usable ? 'You fire and miss.' : 'You swing and miss.');
      if (w && w.usable) {
        const left = Math.max(0, w.cond - randInt(rng, CONFIG.weaponWear));
        s.condition[w.item.id] = left;
        if (left === 0) log.push('Your ' + w.item.name + ' jams for good. It needs a gunsmith.');
      }
    } else if (action === 'defend') {
      defending = true;
      log.push('You cover up and wait for the opening.');
    } else if (action === 'negotiate') {
      const ch = clamp(enc.negotiate + (e.charisma - 5) * COMBAT.chaPerPoint, 0.15, COMBAT.accMax);
      if (rng() < ch) { end = 'negotiated'; log.push('You talk him down. He pockets his hands and looks for a door.'); }
      else log.push('He is not in a listening mood.');
    } else if (action === 'escape') {
      const ch = clamp(enc.escape + (e.agility - 5) * COMBAT.agiPerPoint, 0.2, COMBAT.accMax);
      if (rng() < ch) { end = 'escaped'; log.push('You break away and lose him in the crowd.'); }
      else log.push('You try to run and he cuts you off.');
    }
    if (!end) {
      const acc = hitChance(enc.enemy.acc, -(e.agility - 5) * COMBAT.accPerPoint);
      if (rng() < acc) {
        let dmg = randInt(rng, enc.enemy.dmg);
        if (defending) dmg = Math.round(dmg * (1 - COMBAT.defenseCut));
        s.player.health -= dmg;
        log.push('The ' + enc.enemy.name + ' hits you for ' + dmg + (defending ? ' (blunted by your guard).' : '.'));
        if (s.player.health <= 0) end = 'defeated';
      } else log.push('The ' + enc.enemy.name + ' misses.');
    }
    c.log = c.log.concat(log).slice(-COMBAT.logMax);
    c.round += 1;
    if (!end) { normalize(s); return { ok: true, state: s, events: log, ended: null, enemyHp: c.enemyHp }; }

    const rankBefore = playerRankIdx(s);
    const districtsBefore = DISTRICTS.filter((d) => rankBefore >= RANK_IDX[d.rankReq]).map((d) => d.id);
    let cashMinor = 0, xp = 0, respect = 0, heat = enc.heat, lostMinor = 0;
    if (end === 'won') { cashMinor = D(randInt(rng, enc.cash)); xp = enc.xp; respect = enc.respect; }
    else if (end === 'negotiated') { cashMinor = D(Math.round(randInt(rng, enc.cash) * 0.5)); xp = Math.round(enc.xp * 0.6); respect = Math.round(enc.respect * 0.5); heat = Math.round(enc.heat / 2); }
    else if (end === 'defeated') { xp = Math.round(enc.xp * 0.2); lostMinor = Math.min(s.player.cashMinor, D(enc.lossCash)); s.player.health = CONFIG.defeatRecoveryHealth; }
    s.player.cashMinor += cashMinor - lostMinor;
    if (cashMinor) pushLedger(s, 'reward', cashMinor, enc.title, now);
    if (lostMinor) pushLedger(s, 'loss', -lostMinor, enc.title, now);
    s.player.xp += xp; s.player.respect += respect; s.player.heat = clamp(s.player.heat + heat, 0, CONFIG.maxHeat);
    const verb = { won: 'Won', negotiated: 'Talked your way out of', escaped: 'Got away from', defeated: 'Lost' }[end];
    let line = verb + ' "' + enc.title + '".';
    if (cashMinor) line += ' +' + fmtMoney(cashMinor) + '.';
    if (lostMinor) line += ' Lost ' + fmtMoney(lostMinor) + '.';
    pushActivity(s, line, end === 'defeated' ? 'failure' : end === 'escaped' ? 'event' : 'success', now);
    if (end === 'defeated') pushActivity(s, 'You were knocked out and came to in an alley with your health restored to ' + CONFIG.defeatRecoveryHealth + '.', 'failure', now);
    const rankAfter = playerRankIdx(s), promotions = [];
    let attrPointsGained = 0;
    for (let i = rankBefore + 1; i <= rankAfter; i++) {
      promotions.push({ rank: RANKS[i].name, xp: RANKS[i].xp });
      pushActivity(s, 'You were promoted to ' + RANKS[i].name + '.', 'promotion', now);
      if (CONFIG.attrPointRanks.includes(RANKS[i].id)) { s.player.attrPoints += 1; attrPointsGained += 1; }
    }
    if (attrPointsGained) pushActivity(s, 'You earned ' + attrPointsGained + ' attribute point' + (attrPointsGained > 1 ? 's' : '') + ' to spend.', 'promotion', now);
    const districts = DISTRICTS.filter((d) => rankAfter >= RANK_IDX[d.rankReq] && !districtsBefore.includes(d.id)).map((d) => d.name);
    const achievements = checkAchievements(s, now);
    s.combat = null;
    normalize(s);
    return { ok: true, state: s, events: log, enemyHp: c.enemyHp, ended: { outcome: end, encId: enc.id, title: enc.title, cashMinor, lostMinor, xp, respect, heat, promotions, attrPointsGained, districts, achievements, knockedOut: end === 'defeated' } };
  }

  /* ---------- daily envelope (a reason to come back; all values PROVISIONAL) ----------
     One envelope per 24 hours. Cash grows with rank and with a streak (+10% per consecutive day, up to 7). Miss more than 48 hours and the streak restarts.

    const tiers = 2 + Math.floor(r() * 2);
    for (let t = 0; t < tiers; t++) {
      const th = t === 0 ? ch * 0.6 : ch * 0.22;
      out += '<rect x="' + f1(cx - cw / 2) + '" y="' + f1(cy - th) + '" width="' + f1(cw) + '" height="' + f1(th) + '" fill="' + fill + '"/>';
      if (lit) out += windows(r, cx - cw / 2, cy - th, cw, th, { lit: lit });
      cy -= th; cw *= 0.68;
    }
    if (spire) out += '<path d="M' + f1(cx - cw / 2) + ' ' + f1(cy) + ' L' + f1(cx) + ' ' + f1(cy - 34 - r() * 20) + ' L' + f1(cx + cw / 2) + ' ' + f1(cy) + 'Z" fill="' + fill + '"/>';
    return out;
  }

  function skyline(seed, baseY, W, minH, maxH, fill, lit, spireProb) {
    const r = rng(seed);
    let out = '', x = -20;
    while (x < W) {
      const w = 50 + r() * 70, h = minH + r() * (maxH - minH);
      out += tower(r, x, baseY, w, h, fill, lit, r() < spireProb);
      x += w * (0.7 + r() * 0.5);
    }
    return out;
  }
